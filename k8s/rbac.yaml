# RBAC for the control plane to manage data plane pods AND session state in its
# own namespace (AC-A1/A2/A3, AC-C1). The client-go orchestrator creates one pod
# per session, polls it to Ready (get), and deletes it on terminate/snapshot.
# The ConfigMap/Lease state store keeps one ConfigMap per session (session
# metadata) and one Lease per session (occupancy lock), so the Role also grants
# configmaps and coordination.k8s.io/leases. Namespaced Role (not ClusterRole):
# session pods, ConfigMaps, and Leases all live in the control plane's own
# namespace. The one cluster-scoped exception is the CRIU checkpoint
# ClusterRole at the bottom — the kubelet ContainerCheckpoint call rides the
# cluster-scoped nodes/proxy subresource, which no namespaced Role can grant.
#
# Applied by Flux alongside deployment.yaml into the session-platform namespace
# (cluster/session-platform.yaml). The namespace is intentionally omitted so the
# objects land in the kustomization's target namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  labels:
    app: control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-pods
  labels:
    app: control-plane
rules:
  # Data plane pods: one dedicated pod per session (AC-A1/A2/A3).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Session state store: one ConfigMap per session holds the session metadata;
  # CompareAndSwapState reads + updates it under optimistic concurrency (AC-C1).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Per-session occupancy locks: one Lease per session, created/taken-over and
  # released around snapshot/restore (AC-C1).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-pods
  labels:
    app: control-plane
subjects:
  - kind: ServiceAccount
    name: control-plane
roleRef:
  kind: Role
  name: control-plane-pods
  apiGroup: rbac.authorization.k8s.io
---
# CRIU checkpoint (CRIU_ENABLED=1 only): the real Checkpointer drives the
# kubelet ContainerCheckpoint API through the API server's node proxy —
#   POST /api/v1/nodes/{node}/proxy/checkpoint/{ns}/{pod}/{container}
# (internal/adapter/criu/container_checkpointer.go). Nodes are cluster-scoped,
# so the namespaced Role above cannot grant this; a POST through nodes/proxy
# authorizes as verb "create" on the nodes/proxy subresource. With the gate off
# (the default, and the kind e2e SUT) this permission is never exercised.
#
# NOTE(scope): "create" on nodes/proxy is broad — the ContainerCheckpoint API
# (alpha) has no finer-grained RBAC, and the same verb admits other kubelet
# POST endpoints via the proxy. Revisit at provisioning if a tighter boundary
# is wanted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: session-platform-node-checkpoint
  labels:
    app: control-plane
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: session-platform-node-checkpoint
  labels:
    app: control-plane
subjects:
  - kind: ServiceAccount
    name: control-plane
    # Unlike the RoleBinding above, a ClusterRoleBinding subject cannot inherit
    # the kustomization's target namespace — the SA namespace must be explicit.
    # This is the Flux target namespace (cluster/session-platform.yaml). The
    # kind e2e overlay deploys elsewhere, but CRIU is off there so the dangling
    # subject is inert and harmless.
    namespace: session-platform
roleRef:
  kind: ClusterRole
  name: session-platform-node-checkpoint
  apiGroup: rbac.authorization.k8s.io
