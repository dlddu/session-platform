# Control plane Deployment. Serves the REST API (/api/v1) and the embedded SPA
# on one port (8080), orchestrating data plane pods (AC-A1) via the in-cluster
# client-go orchestrator. It runs as the control-plane ServiceAccount (see
# rbac.yaml) and provisions session pods in this same namespace, resolving the
# namespace from the mounted service account (no SESSION_NAMESPACE env needed).
#
# The image is published by .github/workflows/docker-build-push.yaml. The
# namespace is created by flux-cd-apps (cluster/session-platform.yaml) with the
# external-secrets/github label, which provisions the `ghcr` pull secret used
# below. The `gitops-repository` pod annotation is injected by Flux.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          image: ghcr.io/dlddu/session-platform:latest
          ports:
            - containerPort: 8080
          env:
            - name: CP_ADDR
              value: ":8080"
            # Session pods run the published data plane agent image: a
            # PTY-attached interactive shell behind attach/healthz endpoints
            # (AC-D1, see data-plane/). Published alongside the control-plane
            # image by .github/workflows/docker-build-push.yaml.
            - name: DATA_PLANE_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:latest"
            - name: CRIU_ENABLED
              value: "false" # gated off until a verified runtime exists
            # Checkpoint archive S3 store config (decision ③, docs/criu-verification.md):
            # bucket / assume-role ARN / region / key prefix. Sourced from the
            # `checkpoint-s3` Secret rather than inlined here. The Secret is
            # provisioned out-of-band — in production by external-secrets (as the
            # ghcr pull secret is), and for CRIU verification by creating it
            # directly (see k8s/checkpoint-s3-secret.example.yaml). These are
            # config, not credentials — access is by assume-role over the node
            # instance profile, so there are no static keys here.
            # optional: true keeps runs without the Secret (CRIU off, kind e2e)
            # starting cleanly; the S3 store is only built when CRIU_ENABLED=true.
            - name: CHECKPOINT_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: bucket
                  optional: true
            - name: CHECKPOINT_S3_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: role-arn
                  optional: true
            - name: CHECKPOINT_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: region
                  optional: true
            - name: CHECKPOINT_S3_PREFIX
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: prefix
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
