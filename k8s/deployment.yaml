# Control plane Deployment. Serves the REST API (/api/v1) and the embedded SPA
# on one port (8080), orchestrating data plane pods (AC-A1) via the in-cluster
# client-go orchestrator. It runs as the control-plane ServiceAccount (see
# rbac.yaml) and provisions session pods in this same namespace, resolving the
# namespace from the mounted service account (no SESSION_NAMESPACE env needed).
#
# 이미지는 .github/workflows/docker-build-push.yaml 이 커밋 SHA 태그로 발행하고,
# 같은 워크플로의 `pin` job 이 main 푸시마다 아래 세 자리(컨테이너 image 1곳 +
# DATA_PLANE_IMAGE / DATA_PLANE_CLAUDE_CODE_IMAGE env 2곳)를 그 커밋의 SHA 로 바꿔
# main 에 되커밋한다. 그래서 이 파일이 곧 "운영이 지금 어느 커밋을 돌리는가"의 단일
# 출처다 — 롤링 태그도 :latest 도 없다.
#
# 손으로 고칠 일은 롤백뿐이고, 그때는 되돌릴 커밋의 SHA 를 세 자리에 모두 적는다.
# 태그가 불변이라 imagePullPolicy 는 기본값(IfNotPresent)이 그대로 옳다.
#
# PR 프리뷰 환경(flux-cd-apps 의 apps/session-platform-preview)은 이 base 를 그대로
# 쓰되 세 자리를 PR head SHA 로 덮어쓴다.
#
# 네임스페이스는 flux-cd-apps(cluster/session-platform.yaml)가 만든다. GHCR 패키지는
# 공개라 imagePullSecret 은 필요 없다. `gitops-repository` pod 애노테이션은 Flux 가
# 주입한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          # ⚙️ CI가 관리하는 줄입니다(docker-build-push.yaml 의 `pin` job).
          image: ghcr.io/dlddu/session-platform:27bc0749403cc181f4a7da4414f6c957f8d47e71
          ports:
            - containerPort: 8080
          env:
            - name: CP_ADDR
              value: ":8080"
            # Session pods run the published multi-workload data plane agent
            # image. DATA_PLANE_WORKLOAD selects PTY shell or Claude Code mode.
            # ⚙️ 아래 value 도 CI의 `pin` job 이 관리한다(env value 라 kustomize 의
            # images 변환이 닿지 않는 자리다).
            - name: DATA_PLANE_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:27bc0749403cc181f4a7da4414f6c957f8d47e71"
            # mock-exception: CRIU-GATE — 검증된 런타임이 설 때까지 off가 프로덕션의 의도된
            # 동작이다(그 경로에서 쉘 동결/복원은 no-op 스텁). e2e 오버레이(deploy/)만 on으로
            # 올려 실 경로를 탄다. 등재: docs/test/e2e.md 「e2e 충실도 허용목록」.
            - name: CRIU_ENABLED
              # Production stays opt-in until node capability, privileged-pod,
              # and durable checkpoint-store policies are explicitly approved.
              value: "false"
            # ⚙️ 아래 value 도 CI의 `pin` job 이 관리한다.
            - name: DATA_PLANE_CLAUDE_CODE_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:27bc0749403cc181f4a7da4414f6c957f8d47e71"
            # The required base-url/auth-token keys are referenced only by the
            # localhost credential-proxy sidecar. The required k3s-mcp-token is
            # referenced only by the Claude tool-running container. A
            # platform-default Claude session may reference the optional model
            # key from that container. The control plane receives only the
            # optional, public default model and models catalog below; it never
            # receives provider credentials or the K3s MCP token (AC-E6).
            # Provision it out of band; see the example Secret manifest. If
            # this name is changed, patch both SecretKeyRef names below to the
            # same literal (Kubernetes does not interpolate env values).
            - name: CLAUDE_CODE_CREDENTIALS_SECRET
              value: "claude-code-credentials"
            # Public effective default shown by the SPA. The session pod still
            # resolves its own platform-default SecretKeyRef when it starts.
            - name: CLAUDE_CODE_DEFAULT_MODEL
              valueFrom:
                secretKeyRef:
                  name: claude-code-credentials
                  key: model
                  optional: true
            # Ordered model choices shown by the SPA. This optional Secret key
            # is a JSON string array. Missing/empty keeps the free-text input.
            - name: CLAUDE_CODE_MODELS
              valueFrom:
                secretKeyRef:
                  name: claude-code-credentials
                  key: models
                  optional: true
            # Explicit data-transfer gate. When enabled, Claude workspace,
            # conversation state and output archives are stored in the S3
            # destination below. Keep off until that destination is approved.
            - name: CLAUDE_CODE_ARCHIVE_ENABLED
              value: "true"
            # Checkpoint archive S3 store config (decision ③, docs/criu-verification.md):
            # bucket / assume-role ARN / region / key prefix. Sourced from the
            # `checkpoint-s3` Secret rather than inlined here. The Secret is
            # REQUIRED (no `optional`), so the pod will not start until it exists:
            # in production external-secrets provisions it (as it does the ghcr
            # pull secret); the kind e2e overlay (deploy/) ships a placeholder; for
            # CRIU verification create it directly (k8s/checkpoint-s3-secret.example.yaml).
            # These are config, not credentials — S3 access is by assume-role over
            # the node instance profile, so there are no static keys here.
            - name: CHECKPOINT_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: bucket
            - name: CHECKPOINT_S3_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: role-arn
            - name: CHECKPOINT_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: region
            - name: CHECKPOINT_S3_PREFIX
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: prefix
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
