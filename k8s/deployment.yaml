# Control plane Deployment. Serves the REST API (/api/v1) and the embedded SPA
# on one port (8080), orchestrating data plane pods (AC-A1) via the in-cluster
# client-go orchestrator. It runs as the control-plane ServiceAccount (see
# rbac.yaml) and provisions session pods in this same namespace, resolving the
# namespace from the mounted service account (no SESSION_NAMESPACE env needed).
#
# The image is published by .github/workflows/docker-build-push.yaml. The
# namespace is created by flux-cd-apps (cluster/session-platform.yaml) with the
# external-secrets/github label, which provisions the `ghcr` pull secret used
# below. The `gitops-repository` pod annotation is injected by Flux.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          image: ghcr.io/dlddu/session-platform:latest
          ports:
            - containerPort: 8080
          env:
            - name: CP_ADDR
              value: ":8080"
            # Session pods run the published multi-workload data plane agent
            # image. DATA_PLANE_WORKLOAD selects PTY shell or Claude Code mode.
            - name: DATA_PLANE_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:latest"
            - name: CRIU_ENABLED
              # Production stays opt-in until node capability, privileged-pod,
              # and durable checkpoint-store policies are explicitly approved.
              value: "false"
            - name: DATA_PLANE_CLAUDE_CODE_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:latest"
            # The required base-url/auth-token keys are referenced only by the
            # localhost credential-proxy sidecar. A platform-default Claude
            # session may reference the optional model key from its tool-running
            # container. The control plane receives only the optional, public
            # models catalog below; it never receives provider credentials
            # (AC-E6).
            # Provision it out of band; see the example Secret manifest. If
            # this name is changed, patch the models SecretKeyRef name below to
            # the same literal (Kubernetes does not interpolate env values).
            - name: CLAUDE_CODE_CREDENTIALS_SECRET
              value: "claude-code-credentials"
            # Ordered model choices shown by the SPA. This optional Secret key
            # is a JSON string array. Missing/empty keeps the free-text input.
            - name: CLAUDE_CODE_MODELS
              valueFrom:
                secretKeyRef:
                  name: claude-code-credentials
                  key: models
                  optional: true
            # Explicit data-transfer gate. When enabled, Claude workspace,
            # conversation state and output archives are stored in the S3
            # destination below. Keep off until that destination is approved.
            - name: CLAUDE_CODE_ARCHIVE_ENABLED
              value: "false"
            # Checkpoint archive S3 store config (decision ③, docs/criu-verification.md):
            # bucket / assume-role ARN / region / key prefix. Sourced from the
            # `checkpoint-s3` Secret rather than inlined here. The Secret is
            # REQUIRED (no `optional`), so the pod will not start until it exists:
            # in production external-secrets provisions it (as it does the ghcr
            # pull secret); the kind e2e overlay (deploy/) ships a placeholder; for
            # CRIU verification create it directly (k8s/checkpoint-s3-secret.example.yaml).
            # These are config, not credentials — S3 access is by assume-role over
            # the node instance profile, so there are no static keys here.
            - name: CHECKPOINT_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: bucket
            - name: CHECKPOINT_S3_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: role-arn
            - name: CHECKPOINT_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: region
            - name: CHECKPOINT_S3_PREFIX
              valueFrom:
                secretKeyRef:
                  name: checkpoint-s3
                  key: prefix
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
