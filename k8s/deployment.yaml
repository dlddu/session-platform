# Control plane Deployment. Serves the REST API (/api/v1) and the embedded SPA
# on one port (8080), orchestrating data plane pods (AC-A1) via the in-cluster
# client-go orchestrator. It runs as the control-plane ServiceAccount (see
# rbac.yaml) and provisions session pods in this same namespace, resolving the
# namespace from the mounted service account (no SESSION_NAMESPACE env needed).
#
# 이미지는 .github/workflows/ci.yml 의 이미지 job 들이 커밋 SHA 태그로 발행하고,
# 같은 워크플로의 `pin` job 이 main 푸시마다 아래 세 자리(컨테이너 image 1곳 +
# DATA_PLANE_IMAGE / DATA_PLANE_CLAUDE_CODE_IMAGE env 2곳)를 그 커밋의 SHA 로 바꿔
# main 에 되커밋한다. 그래서 이 파일이 곧 "운영이 지금 어느 커밋을 돌리는가"의 단일
# 출처다 — 롤링 태그도 :latest 도 없다.
#
# 손으로 고칠 일은 롤백뿐이고, 그때는 되돌릴 커밋의 SHA 를 세 자리에 모두 적는다.
# 태그가 불변이라 imagePullPolicy 는 기본값(IfNotPresent)이 그대로 옳다.
#
# PR 프리뷰 환경(flux-cd-apps 의 apps/session-platform-preview)은 이 base 를 그대로
# 쓰되 세 자리를 PR head SHA 로 덮어쓴다.
#
# 네임스페이스는 flux-cd-apps(cluster/session-platform.yaml)가 만든다. GHCR 패키지는
# 공개라 imagePullSecret 은 필요 없다. `gitops-repository` pod 애노테이션은 Flux 가
# 주입한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels:
    app: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      containers:
        - name: control-plane
          # ⚙️ CI가 관리하는 줄입니다(ci.yml 의 `pin` job).
          image: ghcr.io/dlddu/session-platform:cc4615f73c4db0df6151680d65ee6390a0e5ee52
          ports:
            - containerPort: 8080
          env:
            - name: CP_ADDR
              value: ":8080"
            # Session pods run the published multi-workload data plane agent
            # image. DATA_PLANE_WORKLOAD selects PTY shell or Claude Code mode.
            # ⚙️ 아래 value 도 CI의 `pin` job 이 관리한다(env value 라 kustomize 의
            # images 변환이 닿지 않는 자리다).
            - name: DATA_PLANE_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:cc4615f73c4db0df6151680d65ee6390a0e5ee52"
            # Shell data-transfer gate. When enabled, a shell session's home
            # directory and scrollback are archived to the S3 destination below
            # on snapshot; off, a shell refuses to freeze and keeps its pod.
            # ⚠️ PR 프리뷰 오버레이(flux-cd-apps apps/session-platform-preview)는 S3 를
            # 주입하지 않으므로 이 이름을 false 로 덮어쓴다(flux-cd-apps #100).
            # This entry must stay at env index 2: deploy/ patches by index.
            - name: SHELL_ARCHIVE_ENABLED
              value: "true"
            # ⚙️ 아래 value 도 CI의 `pin` job 이 관리한다.
            - name: DATA_PLANE_CLAUDE_CODE_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:cc4615f73c4db0df6151680d65ee6390a0e5ee52"
            # This Secret holds credentials only: the required auth-token,
            # referenced only by the localhost credential-proxy sidecar, and the
            # required k3s-mcp-token, referenced only by the Claude tool-running
            # container. The non-credential keys live in the `claude-code-config`
            # ConfigMap (CLAUDE_CODE_CONFIG_CONFIGMAP's default, so it is not
            # set here): the required base-url and optional ca-cert reach the
            # sidecar only; the optional model, k3s-mcp-url and
            # plugin-marketplace-url reach the tool-running container only; and
            # the optional model and models catalog also reach the control plane
            # below. The control plane never receives provider credentials or
            # the K3s MCP token (AC-E6). Provision both out of band; see the
            # example Secret and ConfigMap manifests.
            - name: CLAUDE_CODE_CREDENTIALS_SECRET
              value: "claude-code-credentials"
            # Public effective default shown by the SPA. The session pod still
            # resolves its own platform-default ConfigMapKeyRef when it starts.
            # If CLAUDE_CODE_CONFIG_CONFIGMAP is changed from its default, patch
            # both configMapKeyRef names below to the same literal (Kubernetes
            # does not interpolate env values).
            - name: CLAUDE_CODE_DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: claude-code-config
                  key: model
                  optional: true
            # Ordered model choices shown by the SPA. This optional ConfigMap
            # key is a JSON string array. Missing/empty keeps the free-text input.
            - name: CLAUDE_CODE_MODELS
              valueFrom:
                configMapKeyRef:
                  name: claude-code-config
                  key: models
                  optional: true
            # Explicit data-transfer gate. When enabled, Claude workspace,
            # conversation state and output archives are stored in the S3
            # destination below. Keep off until that destination is approved.
            - name: CLAUDE_CODE_ARCHIVE_ENABLED
              value: "true"
            # Workload archive S3 store config: bucket / assume-role ARN / region /
            # key prefix. Sourced from the
            # `checkpoint-s3` ConfigMap rather than inlined here. The ConfigMap is
            # REQUIRED (no `optional`), so the pod will not start until it exists:
            # in production external-secrets renders it from SSM; the kind e2e
            # overlay (deploy/) points it at MinIO; for a manual archive round trip
            # create it directly (k8s/checkpoint-s3-configmap.example.yaml).
            # These are config, not credentials — S3 access is by assume-role over
            # the node instance profile, so there are no static keys here, and
            # that is why this is a ConfigMap rather than a Secret.
            - name: CHECKPOINT_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: checkpoint-s3
                  key: bucket
            - name: CHECKPOINT_S3_ROLE_ARN
              valueFrom:
                configMapKeyRef:
                  name: checkpoint-s3
                  key: role-arn
            - name: CHECKPOINT_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: checkpoint-s3
                  key: region
            - name: CHECKPOINT_S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: checkpoint-s3
                  key: prefix
            # minimax-code 워크로드(AC-G1~G4). 이 세 항목은 env 목록 **맨 끝**에 둔다 —
            # deploy/ 오버레이가 env 를 인덱스로 잡고 있어서, 앞에 끼워 넣으면 그쪽 패치가
            # 엉뚱한 항목을 덮어쓴다.
            #
            # 이미지는 같은 멀티 워크로드 data plane 이미지다(DATA_PLANE_WORKLOAD 로 분기).
            # 문자열이 위 이미지와 같아서 CI `pin` job 의 sed 가 이 자리도 함께 SHA 로 고정한다.
            - name: DATA_PLANE_MINIMAX_CODE_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:cc4615f73c4db0df6151680d65ee6390a0e5ee52"
            # 이 Secret 은 자격 증명만 담는다 — 필수 auth-token(헬퍼 파드 credential-proxy)과
            # 선택 k3s-mcp-token(헬퍼 파드 k3s-mcp-proxy). 필수 base-url·선택 ca-cert(credential-proxy)
            # 와 선택 model(platform-default 세션의 주 컨테이너)은 ConfigMap `minimax-code-config`
            # (MINIMAX_CODE_CONFIG_CONFIGMAP 기본값)에 있다. 둘 다 claude-code 쪽과 섞이지 않는다 —
            # 이름이 겹치면 control plane 이 기동을 거부한다.
            # k8s/minimax-code-credentials-secret.example.yaml · minimax-code-config-configmap.example.yaml 참고.
            # 둘이 없으면 이 타입의 세션 생성만 실패하고 다른 타입은 영향이 없다.
            - name: MINIMAX_CODE_CREDENTIALS_SECRET
              value: "minimax-code-credentials"
            # 이 타입 전용 데이터 전송 게이트(AC-G4). on 이면 minimax-code 세션의 작업
            # 디렉터리·대화 기록·출력 아카이브가 위 CHECKPOINT_S3_* 로 간다.
            # ⚠️ PR 프리뷰 오버레이(flux-cd-apps apps/session-platform-preview)는 S3 를
            # 주입하지 않으므로 이 이름을 false 로 덮어써야 한다 — 안 그러면 프리뷰의
            # control plane 이 체크포인트 저장소 없이 기동하다 종료한다. 그 오버레이 변경이
            # 이 값보다 먼저 들어가 있어야 한다.
            - name: MINIMAX_CODE_ARCHIVE_ENABLED
              value: "true"
            # 승인 게이트(docs/prd/approval-gate.md AC-F3)는 PocketAide 다. 이 주소는 게이트
            # 뒤의 타입(지금은 minimax-code) 헬퍼 파드의 MCP 컨테이너에만 평문 env 로 전달된다(비밀이 아니다). 인증은
            # session-mcp 서비스 어카운트의 projected 토큰이고, 그 어카운트가 PocketAide 에
            # 호출자로 등록돼 있어야 한다 — session-mcp-serviceaccount.yaml 참고.
            # 비우면 헬퍼 파드는 게이트 없이 떠서 세션 MCP 가 도구를 하나도 내놓지 않는다.
            # 이 항목도 env 목록 맨 끝에 둔다(위 minimax 항목과 같은 이유).
            - name: APPROVAL_GATEWAY_URL
              value: http://pocket-aide.pocket-aide.svc.cluster.local:8080
            # drop 파일 전달(docs/prd/drop-file-share.md). 게이트 뒤 타입(minimax-code) 헬퍼 파드의
            # 세션 MCP 컨테이너에만 평문 env 로 간다 — drop_upload·drop_download 가 이 주소로 나가고,
            # 인증은 session-mcp 서비스 어카운트의 projected 토큰(audience drop)을 drop 이 단기 키로
            # 바꿔 주는 것이다. drop 쪽 SA_ALLOW 에 session-platform/session-mcp 가 있어야 하고,
            # 없으면(PR 프리뷰 네임스페이스처럼) 두 도구는 403 으로 실패한다(fail-closed).
            # ExternalName → Traefik → Sablier 를 지나므로 첫 요청은 drop 을 깨우느라 늦을 수 있다.
            # 비우면 drop 도구가 목록에 오르지 않는다. 이 항목도 env 목록 맨 끝에 둔다(위와 같은 이유) —
            # deploy/ 오버레이가 이 자리를 env/16 으로 잡아 kind 안 drop 주소로 바꾼다.
            - name: DROP_URL
              value: http://drop-external.drop.svc.cluster.local
            # codex 워크로드(docs/prd/codex-workload.md, AC-J1~J6)와 멀티테넌시(docs/prd/multitenancy.md).
            # 이 다섯 항목도 env 목록 맨 끝에 둔다 — deploy/ 오버레이가 env/19(이미지)를 인덱스로 잡는다.
            # 이미지 문자열이 위와 같아서 CI `pin` job 의 sed 가 이 자리도 함께 SHA 로 고정한다.
            - name: DATA_PLANE_CODEX_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:cc4615f73c4db0df6151680d65ee6390a0e5ee52"
            # codex 세션은 ChatGPT 로그인을 세션마다 스스로 한다(AC-J3) — 공급자 Secret 이 없다.
            # Secret `codex-credentials` 는 선택 k3s-mcp-token 하나만, ConfigMap `codex-config` 는
            # 선택 model·models·k3s-mcp-url·plugin-marketplace-url 만 담는다. 둘 다 없어도 세션은
            # 뜬다(K3s MCP 도구와 플러그인 스킬 없이). k8s/codex-*.example.yaml 참고.
            - name: CODEX_DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: codex-config
                  key: model
                  optional: true
            - name: CODEX_MODELS
              valueFrom:
                configMapKeyRef:
                  name: codex-config
                  key: models
                  optional: true
            # codex 전용 데이터 전송 게이트(AC-J4). 이 타입의 아카이브에는 세션의 ChatGPT
            # 로그인(auth.json)이 들어간다. PR 프리뷰 오버레이는 이 이름을 false 로 덮어쓴다(flux-cd-apps #109).
            - name: CODEX_ARCHIVE_ENABLED
              value: "true"
            # 테넌시 설정(AC-K3). 없으면 테넌시가 없다 — 토큰 없는 호출(운영자)은 지금과 같고,
            # Bearer 토큰 호출은 모두 403 이다. 토큰 검증(TokenReview)에는 control-plane SA 의
            # system:auth-delegator 바인딩이 필요하다(rbac.yaml 머리말과 같은 이유로 base 밖, flux-cd-apps).
            # k8s/session-platform-tenants-configmap.example.yaml 참고.
            - name: SESSION_PLATFORM_TENANTS
              valueFrom:
                configMapKeyRef:
                  name: session-platform-tenants
                  key: tenants.json
                  optional: true
            # codex 작업용 워크로드(docs/prd/codex-task-workload.md, AC-M1~M4)와 에이전트 인증 풀
            # (docs/prd/agent-auth-pool.md, AC-N1~N5), claude-code 구독 인증(AC-E7). 이 일곱 항목도
            # env 목록 맨 끝에 둔다 — deploy/ 오버레이가 env/24(이미지)·env/29(인증 모드)를 인덱스로 잡는다.
            # 이미지 문자열이 위와 같아서 CI `pin` job 의 sed 가 이 자리도 함께 SHA 로 고정한다.
            - name: DATA_PLANE_CODEX_TASK_IMAGE
              value: "ghcr.io/dlddu/session-platform-data-plane:cc4615f73c4db0df6151680d65ee6390a0e5ee52"
            # codex-task 의 모델 카탈로그(AC-M4). Secret `codex-task-credentials` 는 선택 k3s-mcp-token
            # 하나만, ConfigMap `codex-task-config` 는 선택 model·models·k3s-mcp-url·plugin-marketplace-url
            # 만 담는다. 이름은 codex-chat 의 것과 겹치면 안 된다(AC-M1). k8s/codex-task-*.example.yaml 참고.
            - name: CODEX_TASK_DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: codex-task-config
                  key: model
                  optional: true
            - name: CODEX_TASK_MODELS
              valueFrom:
                configMapKeyRef:
                  name: codex-task-config
                  key: models
                  optional: true
            # codex-task 전용 데이터 전송 게이트(AC-M3). 이 타입의 아카이브에는 로그인이 없다 —
            # auth.json 은 풀 슬롯에만 있다(AC-N4). 대신 셸이 만든 작업 디렉터리 파일이 들어간다.
            - name: CODEX_TASK_ARCHIVE_ENABLED
              value: "true"
            # 인증 풀 크기(AC-N1). 슬롯 i 는 Lease `codex-task-auth-<i>` 와 PVC `<네임스페이스>-codex-task-auth-<i>` 이고 control plane 이
            # 처음 임대할 때 만들며 지우지 않는다. 0 이면 이 타입은 /config 에 나오지 않는다.
            - name: CODEX_TASK_AUTH_SLOTS
              value: "2"
            # claude-code 공급자 인증 모드(AC-E7). subscription 은 풀 `claude-code` 의 슬롯
            # (PVC `<네임스페이스>-claude-code-auth-<i>` 의 .credentials.json)으로 Claude 구독에 직접 붙고 credential-proxy
            # 사이드카를 두지 않는다. gateway 는 AC-E6 의 base-url·auth-token 경로(kind e2e 가 쓴다).
            - name: CLAUDE_CODE_AUTH_MODE
              value: "subscription"
            - name: CLAUDE_CODE_AUTH_SLOTS
              value: "2"
            # 두 풀의 슬롯 PVC 스토리지 클래스(AC-N1). 이 클러스터에는 기본 StorageClass 가 없어
            # 비우면 PVC 가 Pending 에 머문다. efs 는 RWX 라 세션이 노드에 묶이지 않는다. efs 는
            # PVC 이름으로 경로·access point 를 정하므로(`/${.PVC.name}`, reuseAccessPoint) PVC 이름에
            # 네임스페이스가 들어간다 — 프리뷰 슬롯이 운영 슬롯과 같은 디렉터리를 쓰지 않게.
            - name: CLAUDE_CODE_AUTH_STORAGE_CLASS
              value: "efs"
            - name: CODEX_TASK_AUTH_STORAGE_CLASS
              value: "efs"
            # 구독 모드 claude-code 의 모델 카탈로그(AC-E7). 게이트웨이의 model·models(OpenRouter id)는
            # 구독에서 뜻이 없으므로, 같은 ConfigMap 의 별도 선택 키에서 온다.
            # platform-default 세션 파드도 `subscription-model` 키를 읽는다.
            - name: CLAUDE_CODE_SUBSCRIPTION_DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: claude-code-config
                  key: subscription-model
                  optional: true
            - name: CLAUDE_CODE_SUBSCRIPTION_MODELS
              valueFrom:
                configMapKeyRef:
                  name: claude-code-config
                  key: subscription-models
                  optional: true
            # codex-chat 슬롯 풀(AC-N6). 슬롯 i 는 Lease `codex-chat-auth-<i>` 와 PVC
            # `<네임스페이스>-codex-chat-auth-<i>` 이고, 안에 ChatGPT 로그인(auth/)과 세션 DB(db/)를
            # 함께 둔다. 채팅은 장기 단일 세션이라 1 — 0 이면 이 타입은 /config 에 나오지 않는다.
            # 클래스는 다른 풀과 같은 이유로 efs. efs 는 NFS 라 세션 DB 는 WAL 을 쓰지 않는다.
            - name: CODEX_CHAT_AUTH_SLOTS
              value: "1"
            - name: CODEX_CHAT_AUTH_STORAGE_CLASS
              value: "efs"
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
