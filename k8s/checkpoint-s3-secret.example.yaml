# Example Secret for the checkpoint S3 store (decision ③, docs/criu-verification.md).
# The control-plane Deployment reads these four keys via secretKeyRef (REQUIRED —
# the pod will not start until this Secret exists):
#   bucket → CHECKPOINT_S3_BUCKET, role-arn → CHECKPOINT_S3_ROLE_ARN,
#   region → CHECKPOINT_S3_REGION, prefix → CHECKPOINT_S3_PREFIX.
#
# This file is EXAMPLE-ONLY and is deliberately NOT listed in kustomization.yaml:
# real values are provisioned out-of-band, the same way the ghcr pull secret is —
#   - production: external-secrets syncs the `checkpoint-s3` Secret,
#   - CRIU verification: create it directly, e.g.
#
#     kubectl create secret generic checkpoint-s3 \
#       --from-literal=bucket=my-ckpt-bucket \
#       --from-literal=role-arn=arn:aws:iam::123456789012:role/session-checkpointer \
#       --from-literal=region=ap-northeast-2 \
#       --from-literal=prefix=checkpoints
#
# These are configuration, not credentials: S3 access is by assuming role-arn
# over the node instance profile (no static keys). They live in a Secret only to
# keep them out of the committed Deployment manifest.
apiVersion: v1
kind: Secret
metadata:
  name: checkpoint-s3
  labels:
    app: control-plane
type: Opaque
stringData:
  bucket: "REPLACE_ME-checkpoint-bucket"
  role-arn: "arn:aws:iam::REPLACE_ME-account:role/session-checkpointer"
  region: "ap-northeast-2"
  prefix: "checkpoints"
