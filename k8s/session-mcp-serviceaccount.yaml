# Identity of every approval-gated helper pod (AC-F4). The control plane names
# it on the pod and projects a token for it with audience `pocket-aide` into the
# session MCP container only — that token is how PocketAide's approval API
# (PRD-12) recognises this platform as a caller (AC-F3).
#
# 이 어카운트에는 RoleBinding 이 하나도 없다 — 헬퍼 파드는 apiserver 를 부르지 않는다.
# 파드 단위 자동 마운트도 꺼서(automountServiceAccountToken: false) apiserver 용 토큰은
# 어느 컨테이너에도 생기지 않는다.
#
# PocketAide 앱 「승인 게이트 설정」에 `<네임스페이스>/session-mcp`(운영:
# `session-platform/session-mcp`)를 서비스 어카운트 호출자로 등록해야 게이트가 통과한다.
# 등록이 없으면 승인 요청이 401 로 거부되고 그 도구 호출은 실패로 끝난다(fail-closed).
# PR 프리뷰 네임스페이스는 등록하지 않으므로 프리뷰의 게이트 대상 도구는 전부 거부된다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-mcp
  labels:
    app: data-plane
automountServiceAccountToken: false
