# Example Secret for the codex-task workload (docs/prd/codex-task-workload.md).
# Like codex-chat's it holds one optional key and no provider credential: the
# ChatGPT login lives in the auth pool slot the session leases, PVC
# `codex-task-auth-<i>` (docs/prd/agent-auth-pool.md, AC-L1~L4), and an empty
# slot signs in with a device code on the first prompt (AC-M2).
#
#   k3s-mcp-token  (optional) Bearer token for the homelab K3s MCP. Projected
#                  only into the session pod's loopback `k3s-mcp-proxy` sidecar,
#                  never into the container that runs Codex (AC-M1, AC-J6).
#                  Without it the session runs with neither the K3s MCP tools
#                  nor the marketplace plugin skills.
#
# The control plane names it with CODEX_TASK_CREDENTIALS_SECRET (default
# `codex-task-credentials`), which must differ from every other agent type's
# Secret and ConfigMap name — the keys share names, so sharing an object would
# hand codex-task another type's token.
#
# EXAMPLE-ONLY, deliberately NOT listed in kustomization.yaml: provision real
# values out-of-band (production: external-secrets in flux-cd-apps).
apiVersion: v1
kind: Secret
metadata:
  name: codex-task-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  k3s-mcp-token: "REPLACE_ME"
