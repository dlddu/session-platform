# Example only; do not commit real credentials. This is the minimax-code
# counterpart of claude-code-credentials (AC-G3), with the same key names:
#
#   base-url    (required) MiniMax's Anthropic-compatible endpoint. Use the
#               global origin for a global account; a key issued there is
#               rejected by the mainland-China origin (api.minimaxi.com) and
#               vice versa.
#   auth-token  (required) A MiniMax Token Plan subscription key (sk-cp-...) or a
#               pay-as-you-go API key. The credential proxy sends it as
#               `Authorization: Bearer`, which MiniMax accepts for both.
#   model       (optional) The model platform-default sessions run, projected
#               into the tool-running container as MINIMAX_CODE_MODEL. Omit it
#               (or leave it empty) to run the data plane's built-in default,
#               MiniMax-M3. A model chosen on the session itself wins.
#   ca-cert     (optional) Only for a private gateway; see the claude-code
#               example for the semantics, which are identical.
#
# base-url, auth-token and ca-cert reach the localhost credential-proxy sidecar
# only. The tool-running container — where mcode and its shell tools run — sees
# the loopback proxy URL and a non-secret placeholder, never the key.
#
# Provision out-of-band, for example:
#
#   kubectl create secret generic minimax-code-credentials \
#     --from-literal=base-url=https://api.minimax.io/anthropic \
#     --from-literal=auth-token=REPLACE_ME \
#     --from-literal=model=MiniMax-M3
#
# This file is intentionally absent from k8s/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: minimax-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  base-url: "https://api.minimax.io/anthropic"
  auth-token: "REPLACE_ME"
  model: "MiniMax-M3"
