# Example only; do not commit real credentials. This is the minimax-code
# counterpart of claude-code-credentials (AC-G3). Like it, it holds credentials
# only; the non-credential keys live in the `minimax-code-config` ConfigMap
# (minimax-code-config-configmap.example.yaml).
#
#   auth-token  (required) A MiniMax Token Plan subscription key (sk-cp-...) or a
#               pay-as-you-go API key. The credential proxy sends it as
#               `Authorization: Bearer`, which MiniMax accepts for both.
#   k3s-mcp-token (optional) The homelab K3s MCP bearer token (AC-G5). Only the
#               helper pod's k3s-mcp-proxy container reads it. With it, sessions
#               get the K3s MCP tools through that proxy; without it they run
#               without them.
#
# auth-token reaches the helper pod's credential-proxy container only, and
# k3s-mcp-token its k3s-mcp-proxy container only (AC-G6). The tool-running
# container — where mcode and its shell tools run — sees helper pod URLs and a
# non-secret placeholder, never a key.
#
# Provision out-of-band, for example:
#
#   kubectl create secret generic minimax-code-credentials \
#     --from-literal=auth-token=REPLACE_ME \
#     --from-literal=k3s-mcp-token=REPLACE_ME
#
# This file is intentionally absent from k8s/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: minimax-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  auth-token: "REPLACE_ME"
  k3s-mcp-token: "REPLACE_ME"
