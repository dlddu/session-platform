# Example only; do not commit real credentials. Only the localhost credential
# proxy sidecar in each Claude Code session pod reads these SecretKeyRef values.
# The tool-running container and control-plane process never receive them
# (AC-E6).
#
# Provision out-of-band, for example:
#
#   kubectl create secret generic claude-code-credentials \
#     --from-literal=base-url=https://api.anthropic.com \
#     --from-literal=auth-token=REPLACE_ME
#
# This file is intentionally absent from k8s/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  base-url: "https://api.anthropic.com"
  auth-token: "REPLACE_ME"
