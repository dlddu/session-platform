# Example only; do not commit real credentials. This Secret holds the
# claude-code credentials and nothing else; the non-credential keys live in the
# `claude-code-config` ConfigMap (claude-code-config-configmap.example.yaml).
#
#   auth-token    (required) Projected only into the localhost credential-proxy
#                 sidecar.
#   k3s-mcp-token (required) Projected only into the Claude tool-running
#                 container as K3S_MCP_TOKEN for the session-platform plugin.
#
# Provider credentials remain sidecar-only (AC-E6).
#
# Provision out-of-band, for example:
#
#   kubectl create secret generic claude-code-credentials \
#     --from-literal=auth-token=REPLACE_ME \
#     --from-literal=k3s-mcp-token=REPLACE_ME
#
# This file is intentionally absent from k8s/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  auth-token: "REPLACE_ME"
  k3s-mcp-token: "REPLACE_ME"
