# Example only; do not commit real credentials. The required base-url and
# auth-token keys are projected only into the localhost credential-proxy
# sidecar. The required k3s-mcp-token key is projected only into the Claude
# tool-running container as K3S_MCP_TOKEN for the session-platform plugin.
# The optional, non-credential model key is projected into the
# tool-running container as CLAUDE_CODE_MODEL only for platform-default
# sessions, and into the control plane as CLAUDE_CODE_DEFAULT_MODEL for its UI
# snapshot. The optional models catalog is also projected into the control plane;
# provider credentials remain sidecar-only (AC-E6).
#
# The optional, non-credential ca-cert key carries a PEM bundle for a provider
# base-url served by a private gateway whose issuer no public store knows. The
# credential proxy adds it to the system roots rather than replacing them, so a
# publicly issued endpoint keeps working; omit the key entirely and the proxy
# uses the system pool exactly as before. It reaches the proxy container only,
# like base-url and auth-token.
#
# Provision out-of-band, for example:
#
#   kubectl create secret generic claude-code-credentials \
#     --from-literal=base-url=https://api.anthropic.com \
#     --from-literal=auth-token=REPLACE_ME \
#     --from-literal=k3s-mcp-token=REPLACE_ME \
#     --from-literal=model=sonnet \
#     --from-literal=models='["sonnet","opus"]'
#
# Omit model (or set it to an empty string) to let the installed Claude Code
# CLI choose its own default without a --model flag. Explicit concrete models
# selected on a session are injected literally and take precedence over this
# platform default. Omit models (or set it to []) to keep the free-text picker.
# Non-empty model and models entries must match
# ^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$.
# A single leading ~ is supported for OpenRouter moving aliases.
#
# This file is intentionally absent from k8s/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  base-url: "https://api.anthropic.com"
  auth-token: "REPLACE_ME"
  k3s-mcp-token: "REPLACE_ME"
  model: "sonnet"
  models: '["sonnet","opus"]'
