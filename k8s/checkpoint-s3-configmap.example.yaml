# Example ConfigMap for the workload archive S3 store.
# The control-plane Deployment reads these four keys via configMapKeyRef
# (REQUIRED — the pod will not start until this ConfigMap exists):
#   bucket → CHECKPOINT_S3_BUCKET, role-arn → CHECKPOINT_S3_ROLE_ARN,
#   region → CHECKPOINT_S3_REGION, prefix → CHECKPOINT_S3_PREFIX.
#
# This file is EXAMPLE-ONLY and is deliberately NOT listed in kustomization.yaml:
# real values are provisioned out-of-band —
#   - production: external-secrets renders the `checkpoint-s3` ConfigMap from SSM
#     (flux-cd-apps apps/session-platform/checkpoint-s3-external-secret.yaml),
#   - a manual archive round trip: create it directly, e.g.
#
#     kubectl create configmap checkpoint-s3 \
#       --from-literal=bucket=my-ckpt-bucket \
#       --from-literal=role-arn=arn:aws:iam::123456789012:role/session-checkpointer \
#       --from-literal=region=ap-northeast-2 \
#       --from-literal=prefix=checkpoints
#
# These are configuration, not credentials: S3 access is by assuming role-arn
# over the node instance profile (no static keys), so they live in a ConfigMap.
# They are kept out of the committed Deployment manifest because they differ per
# environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkpoint-s3
  labels:
    app: control-plane
data:
  bucket: "REPLACE_ME-checkpoint-bucket"
  role-arn: "arn:aws:iam::REPLACE_ME-account:role/session-checkpointer"
  region: "ap-northeast-2"
  prefix: "checkpoints"
