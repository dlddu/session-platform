openapi: 3.0.3
info:
  title: session-platform control plane API
  version: 0.3.0
  description: >
    REST surface the SPA uses to create, list and operate sessions. Each
    session maps 1:1 to a dedicated data plane *workload* pod and may own
    session-scoped auxiliary pods that serve it (AC-A2). Non-active access is
    uniform "ensure active then serve": read, write and switch promote
    idle->active (AC-C1) or restore snapshot->active (AC-B2) before serving.
    A session picks a workload type at creation (AC-E1): `shell` (the default)
    or `claude-code`. The type is immutable for the session's lifetime — no
    endpoint changes it, and a restore keeps it — so switching workloads means
    creating a new session. For `shell`, write injects the payload into the PTY
    stdin (AC-D2); for `claude-code`, write asynchronously queues one prompt
    execution (AC-E2). Both read paths return workload output after an offset
    cursor, with offset=0 returning the full history (AC-D3/E3). A passive
    `GET /sessions/{id}/stream` exposes the same append-only bytes as
    cursor-resumable SSE without restoring snapshots or refreshing idle
    activity. Each `output` event carries its starting offset, exact base64
    bytes, and server-issued `nextOffset`; Claude event boundaries are UTF-8
    code-point boundaries. `Last-Event-ID` resumes a disconnected client. A
    `reset` event reports the retained length when a requested cursor is ahead
    of it, allowing a full read replay before streaming resumes. Claude stdout
    is projected from partial `stream-json` text deltas
    while diagnostic stderr remains visible, so responses arrive before the
    one-shot process exits. Required Claude Code credentials are projected from
    a platform Secret only into a localhost credential-proxy sidecar; the
    tool-running container receives no real token. Its optional session model
    is immutable and defaults to `platform-default`: whenever that session's
    primary container starts (new pod, restore, or container restart), the alias
    uses the Secret's optional `model` value and then falls back to the
    installed CLI default when the value is missing or empty. A non-empty
    effective model must match `^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$`; invalid
    Secret configuration makes the data-plane agent fail startup.
    The control plane receives the same optional model as
    `CLAUDE_CODE_DEFAULT_MODEL`; `GET /config` exposes that effective concrete
    default (or `platform-default` when absent) together with a separate,
    optional ordered model catalog for UI presentation. The catalog is not an
    API allowlist (AC-E6).
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /config:
    get:
      summary: Get non-sensitive runtime configuration
      operationId: getRuntimeConfig
      description: >
        Returns the Claude Code model picker configuration captured when this
        control-plane process started. `defaultModel` is the effective concrete
        model projected from the Secret, or the stable `platform-default`
        session alias when that value is missing or empty. `models` is an
        ordered soft catalog: clients may present its entries as choices, but
        session creation continues to accept any model that satisfies the model
        syntax. An empty array tells the SPA to retain its free-text model input.
        The response exposes no provider credentials and must not be cached.
      responses:
        "200":
          description: Runtime UI configuration
          headers:
            Cache-Control:
              description: Prevents browsers and intermediaries from retaining a rollout-scoped configuration snapshot.
              schema:
                type: string
                enum: [no-store]
                example: no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfig" }
              example:
                claudeCode:
                  defaultModel: "~anthropic/claude-opus-latest"
                  models: [sonnet, opus]
  /sessions:
    get:
      summary: List sessions
      operationId: listSessions
      responses:
        "200":
          description: All sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
    post:
      summary: Create a session (provisions a dedicated pod, goes active)
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Malformed body, unknown field, trailing JSON, or invalid name, workload type, or model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
  /sessions/{id}:
    get:
      summary: Get a single session
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Delete a session and reclaim its live pod, if any
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A lifecycle operation is already in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sessions/{id}/stream:
    get:
      summary: Stream live workload output from a retained pod without changing lifecycle state
      operationId: streamSessionOutput
      description: >
        Opens a passive Server-Sent Events feed over the same append-only byte
        history exposed by read. It serves active and idle sessions without
        touching lastAccess, and returns 422 for a snapshot instead of restoring
        it. `Last-Event-ID`, when present, takes precedence over the `offset`
        query parameter. An `output` event uses the server-issued byte cursor as
        its SSE id and carries `{offset,payloadBase64,nextOffset}`. Base64
        preserves the exact bytes and decoded byte length; every server-issued
        Claude cursor and event boundary remains a UTF-8 code-point boundary.
        If the requested cursor is greater than the retained length, `reset`
        carries that current length as its SSE id and `data.nextOffset`. The
        client must discard partial decoder state, replace its rendered history
        using read at offset 0, and reconnect from that read's `nextOffset`.
        Opening the stream and receiving output/reset/heartbeat signals remains
        passive. The prescribed read reconciliation is the normal
        state-branched Read API, so it can promote an idle session and refresh
        lastAccess.
        Comment heartbeats keep intermediaries from buffering but do not advance
        a cursor or count as workload access. The connection remains open across
        individual prompt runs until the client disconnects or the retained pod
        is reclaimed.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/StreamOffset"
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: Cursor-resumable SSE output stream with output and stale-cursor reset events
          headers:
            Cache-Control:
              schema: { type: string, example: "no-cache, no-transform" }
            X-Accel-Buffering:
              schema: { type: string, example: "no" }
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                output:
                  summary: Exact output bytes from offsets 12 through 18
                  value: |
                    id: 18
                    event: output
                    data: {"offset":12,"payloadBase64":"aGVsbG8K","nextOffset":18}
                staleCursorReset:
                  summary: Requested cursor was ahead of the retained 18 bytes
                  value: |
                    id: 18
                    event: reset
                    data: {"nextOffset":18}
        "400":
          description: Invalid non-negative offset or Last-Event-ID cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Session not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The session is snapshotted and has no retained pod; restore explicitly before streaming
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sessions/{id}/read:
    post:
      summary: Read workload output since an offset cursor (state-branched, AC-C2)
      operationId: readSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadRequest" }
      responses:
        "200":
          description: Read result with the branch that served it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadResult" }
        "400":
          description: Malformed request body, unknown field, trailing JSON, or invalid offset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
  /sessions/{id}/write:
    post:
      summary: Write to a session (state-branched, AC-C3)
      operationId: writeSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteRequest" }
      responses:
        "200":
          description: Write result with the branch that served it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "400":
          description: Malformed request body, unknown field, or trailing JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "429":
          description: The workload prompt queue is full; retry after an accepted prompt completes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507":
          description: The workload output quota is full; existing output remains readable and restorable but new writes are refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sessions/{id}/switch:
    post:
      summary: Switch to a session, restoring from snapshot if needed (AC-C4)
      operationId: switchSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The now-active session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Malformed body, trailing JSON, or a non-empty request object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "409":
          description: Concurrent state change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sessions/{id}/snapshot:
    post:
      summary: Archive a session on demand and reclaim its pod (AC-B1/AC-A3)
      operationId: snapshotSession
      description: >
        Immediately captures the workload using its configured strategy
        (CRIU checkpoint for shell, filesystem archive for claude-code), moves
        the session to snapshot state, and reclaims its pod. Calling this for
        an already-snapshotted session is idempotent.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The archived session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Malformed body, trailing JSON, or a non-empty request object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Concurrent state change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "503":
          description: The workload's checkpoint or archive strategy is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  responses:
    RequestEntityTooLarge:
      description: The JSON wire body exceeds 8 MiB, or a Claude Code prompt exceeds the 1 MiB decoded payload limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    StreamOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
      description: >
        Server-issued nextOffset cursor for this session; 0 starts at retained
        history. Clients must not calculate it from decoded text. A value ahead
        of the retained byte length produces a reset event whose id and
        data.nextOffset equal the current length.
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      description: >
        SSE reconnect cursor. When present it takes precedence over the offset
        query parameter.
  schemas:
    RuntimeConfig:
      type: object
      additionalProperties: false
      required: [claudeCode]
      properties:
        claudeCode:
          $ref: "#/components/schemas/ClaudeCodeConfig"
    ClaudeCodeConfig:
      type: object
      additionalProperties: false
      required: [defaultModel, models]
      properties:
        defaultModel:
          type: string
          maxLength: 128
          pattern: '^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$'
          description: >
            Effective platform default shown by the UI: the concrete
            Secret-backed model when configured, otherwise the stable
            `platform-default` session alias. Omitting model from a create
            request still records that stable alias so future pod starts follow
            the platform default.
        models:
          type: array
          uniqueItems: true
          description: >
            Ordered, rollout-scoped soft catalog for the UI. It never includes
            the reserved `platform-default` alias and is not an API allowlist.
            Empty means the UI should preserve its free-text model input.
          items:
            type: string
            pattern: '^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$'
    State:
      type: string
      enum: [active, idle, snapshot]
    WorkloadType:
      type: string
      enum: [shell, claude-code]
      default: shell
      description: >
        Which data plane workload the session runs (AC-E1). Fixed at creation
        and immutable afterwards. `shell` is an interactive PTY shell
        (AC-D1~D5); `claude-code` is the Claude Code CLI workload (AC-E2~E6),
        which requires the control plane to have an image configured for it.
    Checkpoint:
      type: object
      properties:
        ref: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        reclaimed: { type: string }
    Session:
      type: object
      required: [id, name, state, workloadType, createdAt, lastAccess]
      properties:
        id: { type: string }
        name: { type: string }
        workloadType: { $ref: "#/components/schemas/WorkloadType" }
        state: { $ref: "#/components/schemas/State" }
        model:
          type: string
          description: >
            Immutable Claude Code model identifier. Present only for
            `claude-code`; omitted at creation resolves to `platform-default`.
            Whenever the primary container starts, including a restart, that
            alias resolves through the optional Secret model and then the CLI
            fallback.
        pod:
          type: string
          description: >
            The session's dedicated workload pod — the 1:1 subject of AC-A2.
            Absent while the session is snapshotted and its pods reclaimed.
        auxiliaryPods:
          type: array
          items: { type: string }
          description: >
            Session-scoped pods that serve the workload pod without running the
            workload themselves (AC-A2's auxiliary-pod clause). They share the
            workload pod's lifetime and are reclaimed with it, so this is absent
            exactly when `pod` is. Both workload types available today
            provision none, so it is absent for every session the API serves
            now; AC-F4's helper pod is the first to appear here.
        createdAt: { type: string, format: date-time }
        lastAccess: { type: string, format: date-time }
        checkpoint: { $ref: "#/components/schemas/Checkpoint" }
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Leading and trailing whitespace is trimmed; at least one non-whitespace character is required.
        workloadType:
          allOf:
            - $ref: "#/components/schemas/WorkloadType"
          description: >
            Optional. Omitted means `shell`, so a request that predates the
            workload type axis behaves unchanged. A value outside the enum is
            rejected with 400 before any pod is provisioned.
        model:
          type: string
          pattern: '^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$'
          description: >
            Claude Code model for this session. Valid only when workloadType is
            `claude-code`; omitted resolves to `platform-default`. A concrete
            value is passed literally and takes precedence over the platform
            Secret default. The catalog returned by GET /config is advisory,
            not an allowlist. Credentials are never accepted in this request.
    WriteRequest:
      type: object
      additionalProperties: false
      properties:
        payload:
          type: string
          description: >
            Raw workload input. Claude Code writes are limited to 1 MiB of UTF-8
            bytes per prompt; larger writes return 413.
    ReadRequest:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          format: int64
          default: 0
          minimum: 0
          description: >
            Cursor issued as nextOffset by a previous read or output/reset
            event for this session. Clients must use a server-issued cursor
            rather than a decoded string length. 0 (or omitted) returns the
            full output accumulated since session start (AC-D3); an offset past
            the current length yields an empty payload at the current cursor.
    ReadResult:
      type: object
      properties:
        session: { $ref: "#/components/schemas/Session" }
        path:
          type: string
          description: which state branch served the read
        payload:
          type: string
          description: >
            Text projection of workload output accumulated after the requested
            byte offset. Shell output is merged PTY stdout/stderr. Claude output
            is valid UTF-8: the ordered projection of partial assistant text
            deltas plus redacted diagnostic stderr; the CLI's stream-json
            envelopes are not exposed.
        nextOffset:
          type: integer
          format: int64
          description: >
            Server-issued byte cursor to pass as offset on the next read or
            stream request. For Claude output it is always a UTF-8 code-point
            boundary. Clients must use this value rather than calculating a
            JavaScript string length.
    WriteResult:
      type: object
      properties:
        session: { $ref: "#/components/schemas/Session" }
        path:
          type: string
          description: which state branch served the write
    Error:
      type: object
      properties:
        error: { type: string }
