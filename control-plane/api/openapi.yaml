openapi: 3.0.3
info:
  title: session-platform control plane API
  version: 0.5.0
  description: >
    REST surface the SPA uses to create, list and operate sessions. Each
    session maps 1:1 to a dedicated data plane *workload* pod and may own
    session-scoped auxiliary pods that serve it (AC-A2). Non-active access is
    uniform "ensure active then serve": read, write and switch promote
    idle->active (AC-C1) or restore snapshot->active (AC-B2) before serving.
    A session picks a workload type at creation (AC-E1): `shell` (the default),
    `claude-code`, `minimax-code`, `codex-chat` or `codex-task`
    (`codex-chat` was `codex` before 2026-11-07). The type is immutable for the session's lifetime — no

    endpoint changes it, and a restore keeps it — so switching workloads means
    creating a new session. For `shell`, write injects the payload into the PTY
    stdin (AC-D2); for `claude-code` (and the agent types that reuse its
    execution model), write asynchronously queues one prompt execution
    (AC-E2, AC-G2). Both read paths return workload output after an offset
    cursor, with offset=0 returning the full history (AC-D3/E3). A passive
    `GET /sessions/{id}/stream` exposes the same append-only bytes as
    cursor-resumable SSE without restoring snapshots or refreshing idle
    activity. Each `output` event carries its starting offset, exact base64
    bytes, and server-issued `nextOffset`; Claude event boundaries are UTF-8
    code-point boundaries. `Last-Event-ID` resumes a disconnected client. A
    `reset` event reports the retained length when a requested cursor is ahead
    of it, allowing a full read replay before streaming resumes. Claude stdout
    is projected from partial `stream-json` text deltas
    while diagnostic stderr remains visible, so responses arrive before the
    one-shot process exits. Required Claude Code credentials are projected from
    a platform Secret only into a localhost credential-proxy sidecar; the
    tool-running container receives no real token. Its optional session model
    is immutable and defaults to `platform-default`: whenever that session's
    primary container starts (new pod, restore, or container restart), the alias
    uses the platform ConfigMap's optional `model` value and then falls back to the
    installed CLI default when the value is missing or empty. A non-empty
    effective model must match `^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$`; invalid
    ConfigMap configuration makes the data-plane agent fail startup.
    The control plane receives the same optional model as
    `CLAUDE_CODE_DEFAULT_MODEL`; `GET /config` exposes that effective concrete
    default (or `platform-default` when absent) together with a separate,
    optional ordered model catalog for UI presentation. The catalog is not an
    API allowlist (AC-E6).

    Tenancy (AC-K1~K5). A request without an `Authorization` header is the
    operator: it sees every session, may filter the list by tenant and may
    create a session on behalf of a tenant. A request with
    `Authorization: Bearer <token>` speaks for a tenant: the token must be a
    Kubernetes ServiceAccount token minted for the `session-platform` audience
    (TokenReview), and the ServiceAccount must be listed by a configured
    tenant. Otherwise the request is answered 401 (token not proven) or 403
    (proven, but no tenant claims it) — never as the operator. A tenant sees
    only its own sessions: every session-id route answers another tenant's
    session, and an untenanted one, with 404 exactly as for a missing id. A
    tenant may create only the workload types its tenant is granted (403
    otherwise), and the repo-access management routes refuse any bearer
    caller with 403.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /config:
    get:
      summary: Get non-sensitive runtime configuration
      operationId: getRuntimeConfig
      description: >
        Returns the workload types this deployment offers (with each type's
        input style and model picker configuration) and, for existing clients,
        the Claude Code model picker configuration, all captured when this
        control-plane process started. `defaultModel` is the effective concrete
        model projected from the platform ConfigMap, or the stable `platform-default`
        session alias when that value is missing or empty. `models` is an
        ordered soft catalog: clients may present its entries as choices, but
        session creation continues to accept any model that satisfies the model
        syntax. An empty array tells the SPA to retain its free-text model input.
        The response exposes no provider credentials and must not be cached.
      responses:
        "200":
          description: Runtime UI configuration
          headers:
            Cache-Control:
              description: Prevents browsers and intermediaries from retaining a rollout-scoped configuration snapshot.
              schema:
                type: string
                enum: [no-store]
                example: no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfig" }
              example:
                tenant: null
                tenants:
                  - name: pocket-aide
                    workloadTypes: [claude-code, codex-chat]
                claudeCode:
                  defaultModel: "~anthropic/claude-opus-latest"
                  models: [sonnet, opus]
                workloadTypes:
                  - type: shell
                    label: Shell
                    description: Interactive bash. You type the commands.
                    takesModel: false
                    takesPlugins: false
                    input: terminal
                    approvalGate: false
                    defaultModel: null
                    models: []
                    reasoningEfforts: []
                  - type: claude-code
                    label: Claude Code
                    description: Agent CLI. You send prompts, it does the work.
                    takesModel: true
                    takesPlugins: true
                    input: prompt
                    approvalGate: false
                    defaultModel: "~anthropic/claude-opus-latest"
                    models: [sonnet, opus]
                    reasoningEfforts: [low, medium, high, xhigh, max]
  /sessions:
    get:
      summary: List the sessions the caller sees
      operationId: listSessions
      parameters:
        - name: tenant
          in: query
          required: false
          schema: { type: string }
          description: >
            Operator only (AC-K2). Keeps sessions owned by this tenant; an
            empty value keeps untenanted (operator-owned) sessions only. A
            tenant caller sending it gets 400 — its list is already scoped.
      responses:
        "400":
          description: A tenant caller sent the operator-only `tenant` filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Every session for the operator; the tenant's own for a tenant caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
    post:
      summary: Create a session (provisions a dedicated pod, goes active)
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Malformed body, unknown field, trailing JSON, or invalid name, workload type, model or tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: >
            The owning tenant is not granted the workload type, or a tenant
            caller named another tenant (AC-K3)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "503": { $ref: "#/components/responses/AuthPoolExhausted" }
  /sessions/{id}:
    get:
      summary: Get a single session
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Delete a session and reclaim its live pod, if any
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A lifecycle operation is already in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sessions/{id}/stream:
    get:
      summary: Stream live workload output from a retained pod without changing lifecycle state
      operationId: streamSessionOutput
      description: >
        Opens a passive Server-Sent Events feed over the same append-only byte
        history exposed by read. It serves active and idle sessions without
        touching lastAccess, and returns 422 for a snapshot instead of restoring
        it. `Last-Event-ID`, when present, takes precedence over the `offset`
        query parameter. An `output` event uses the server-issued byte cursor as
        its SSE id and carries `{offset,payloadBase64,nextOffset}`. Base64
        preserves the exact bytes and decoded byte length; every server-issued
        Claude cursor and event boundary remains a UTF-8 code-point boundary.
        If the requested cursor is greater than the retained length, `reset`
        carries that current length as its SSE id and `data.nextOffset`. The
        client must discard partial decoder state, replace its rendered history
        using read at offset 0, and reconnect from that read's `nextOffset`.
        Opening the stream and receiving output/reset/heartbeat signals remains
        passive. The prescribed read reconciliation is the normal
        state-branched Read API, so it can promote an idle session and refresh
        lastAccess.
        Comment heartbeats keep intermediaries from buffering but do not advance
        a cursor or count as workload access. The connection remains open across
        individual prompt runs until the client disconnects or the retained pod
        is reclaimed.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/StreamOffset"
        - $ref: "#/components/parameters/LastEventID"
      responses:
        "200":
          description: Cursor-resumable SSE output stream with output and stale-cursor reset events
          headers:
            Cache-Control:
              schema: { type: string, example: "no-cache, no-transform" }
            X-Accel-Buffering:
              schema: { type: string, example: "no" }
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                output:
                  summary: Exact output bytes from offsets 12 through 18
                  value: |
                    id: 18
                    event: output
                    data: {"offset":12,"payloadBase64":"aGVsbG8K","nextOffset":18}
                staleCursorReset:
                  summary: Requested cursor was ahead of the retained 18 bytes
                  value: |
                    id: 18
                    event: reset
                    data: {"nextOffset":18}
        "400":
          description: Invalid non-negative offset or Last-Event-ID cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Session not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The session is snapshotted and has no retained pod; restore explicitly before streaming
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sessions/{id}/read:
    post:
      summary: Read workload output since an offset cursor (state-branched, AC-C2)
      operationId: readSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadRequest" }
      responses:
        "200":
          description: Read result with the branch that served it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadResult" }
        "400":
          description: Malformed request body, unknown field, trailing JSON, or invalid offset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "503": { $ref: "#/components/responses/AuthPoolExhausted" }
  /sessions/{id}/write:
    post:
      summary: Write to a session (state-branched, AC-C3)
      operationId: writeSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteRequest" }
      responses:
        "200":
          description: Write result with the branch that served it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "400":
          description: Malformed request body, unknown field, or trailing JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "429":
          description: The workload prompt queue is full; retry after an accepted prompt completes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507":
          description: The workload output quota is full; existing output remains readable and restorable but new writes are refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AuthPoolExhausted" }
  /sessions/{id}/switch:
    post:
      summary: Switch to a session, restoring from snapshot if needed (AC-C4)
      operationId: switchSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The now-active session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Malformed body, trailing JSON, or a non-empty request object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "409":
          description: Concurrent state change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AuthPoolExhausted" }
  /sessions/{id}/snapshot:
    post:
      summary: Archive a session on demand and reclaim its pod (AC-B1/AC-A3)
      operationId: snapshotSession
      description: >
        Immediately captures the workload into its filesystem archive (a
        shell's home directory and scrollback; an agent workload's workspace,
        CLI state and output), moves the session to snapshot state, and
        reclaims its pod. A restored shell is a fresh shell started in its home
        directory. Calling this for
        an already-snapshotted session is idempotent.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The archived session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: Malformed body, trailing JSON, or a non-empty request object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Concurrent state change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "503":
          description: The workload's checkpoint or archive strategy is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /sessions/{id}/plugins/refresh:
    post:
      summary: Fetch a codex-chat or codex-task session's plugin skills again, keeping its conversation (AC-J7)
      operationId: refreshSessionPlugins
      description: >
        Codex sessions only. The session's K3s MCP sidecar clones the plugin
        marketplace again and the agent makes the session's platform-managed
        skills match it; the conversation and thread are untouched, and the
        next resumed turn opens with a note naming what changed. It runs only
        between turns. Like a write, it brings an idle session active and
        restores a snapshotted one first (which by itself already starts from
        the current marketplace). A refresh that cannot reach the marketplace
        keeps the skills the session had. Nothing refreshes on its own.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: What the refresh changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginRefreshResult" }
        "400":
          description: Malformed body, trailing JSON, or a non-empty request object
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found, or another tenant's session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A turn is running or queued, a refresh or checkpoint is already running, or the session's state changed concurrently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "422":
          description: The session is neither codex-chat nor codex-task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The marketplace could not be fetched again; the session keeps the skills it had
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AuthPoolExhausted" }
  /repo-access:
    get:
      summary: Allow list and pending requests (AC-H1/AC-H4)
      description: >
        The management routes (this and the other `/repo-access` paths) have no
        sign-in of their own. Like the session APIs, they sit behind the
        deployment's ingress, whose Authelia forward-auth is the only door
        (AC-H2).
      operationId: getRepoAccess
      tags: [repo-access]
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepoAccessState" }
        "503":
          description: Repo access is not enabled on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /repo-access/allowlist:
    post:
      summary: Add a repository to the allow list
      operationId: addAllowlist
      tags: [repo-access]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepoRef" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
        "200":
          description: Already on the list; the existing entry is unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
        "400":
          description: Not an `owner/repo`, or a malformed body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Repo access is not enabled on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Remove a repository from the allow list (idempotent)
      operationId: removeAllowlist
      tags: [repo-access]
      parameters:
        - name: repo
          in: query
          required: true
          schema: { type: string, example: dlddu/infrastructure }
      responses:
        "204":
          description: Not on the list any more
        "400":
          description: Not an `owner/repo`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Repo access is not enabled on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /repo-access/requests/{requestId}/approve:
    post:
      summary: Approve a session's request; adds the repository and clears every request for it
      operationId: approveRequest
      tags: [repo-access]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The allow list entry (the existing one if already allowed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowlistEntry" }
        "404":
          description: No such pending request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Repo access is not enabled on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /repo-access/requests/{requestId}/reject:
    post:
      summary: Reject a session's request
      operationId: rejectRequest
      tags: [repo-access]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: Rejected; the request is gone
        "404":
          description: No such pending request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Repo access is not enabled on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /internal/repo-access/check:
    get:
      summary: Whether a repository is allowed (helper pods only, AC-H3)
      operationId: checkRepoAccess
      tags: [repo-access-internal]
      security: [{ helperToken: [] }]
      parameters:
        - name: repo
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verdict for the normalized repository
          content:
            application/json:
              schema:
                type: object
                required: [repo, allowed]
                properties:
                  repo: { type: string }
                  allowed: { type: boolean }
        "400":
          description: Not an `owner/repo`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not a helper pod's token for this audience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Repo access is not enabled on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /internal/repo-access/requests:
    post:
      summary: File a request on behalf of the calling helper's session (AC-H4)
      operationId: requestRepoAccess
      tags: [repo-access-internal]
      security: [{ helperToken: [] }]
      description: >
        Deduplicated per session and repository: asking again returns the same
        pending request. An already-allowed repository answers `allowed`
        without filing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repo, reason]
              properties:
                repo: { type: string }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Request state
          content:
            application/json:
              schema:
                type: object
                required: [repo, status]
                properties:
                  repo: { type: string }
                  status: { type: string, enum: [pending, allowed] }
                  requestId: { type: string, description: Set when pending }
        "400":
          description: Not an `owner/repo`, or an empty or overlong reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not a helper pod's token for this audience
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Repo access is not enabled on this deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  responses:
    Unauthenticated:
      description: A bearer token was sent that TokenReview does not prove for the `session-platform` audience (AC-K1)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The caller's ServiceAccount belongs to no tenant, or the route is operator-only (AC-K1, AC-K4)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AuthPoolExhausted:
      description: >
        Every login slot of the session type's auth pool is held (AC-N2), so no
        pod was made. A session that needed a restore stays `snapshot`. The
        body's `error` is exactly `auth pool exhausted`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RequestEntityTooLarge:
      description: The JSON wire body exceeds 8 MiB, or an agent workload prompt (claude-code, minimax-code) exceeds the 1 MiB decoded payload limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    helperToken:
      type: http
      scheme: bearer
      description: >
        Projected service-account token of a session's helper pod, audience
        `session-platform`, verified with TokenReview.
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, example: rq_0123456789abcdef }
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    StreamOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
      description: >
        Server-issued nextOffset cursor for this session; 0 starts at retained
        history. Clients must not calculate it from decoded text. A value ahead
        of the retained byte length produces a reset event whose id and
        data.nextOffset equal the current length.
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
      description: >
        SSE reconnect cursor. When present it takes precedence over the offset
        query parameter.
  schemas:
    RuntimeConfig:
      type: object
      additionalProperties: false
      required: [claudeCode, workloadTypes, tenant, tenants]
      properties:
        tenant:
          allOf:
            - $ref: "#/components/schemas/TenantConfig"
          nullable: true
          description: The calling tenant (AC-K4). `null` for the operator.
        tenants:
          type: array
          description: >
            Tenants the operator may create into and filter by, in
            configuration order (AC-K4). Always empty for a tenant caller and
            when the deployment configures no tenants.
          items:
            $ref: "#/components/schemas/TenantConfig"
        claudeCode:
          $ref: "#/components/schemas/ClaudeCodeConfig"
        workloadTypes:
          type: array
          description: >
            Workload types this deployment can create, in display order (shell
            first). A non-default type is listed only when its data plane image
            is configured, so a client that builds its picker and create-request
            validation from this list needs no release when a type is added.
            `claudeCode` predates this list and repeats its `claude-code` entry
            for existing clients. For a tenant caller the list is further
            narrowed to the tenant's granted types (AC-K3).
          items:
            $ref: "#/components/schemas/WorkloadTypeConfig"
    WorkloadTypeConfig:
      type: object
      additionalProperties: false
      required: [type, label, description, takesModel, takesPlugins, input, approvalGate, defaultModel, models, reasoningEfforts]

      properties:
        type:
          type: string
          description: Value for the create request's `workloadType`. Clients should ignore types they do not know.
        label:
          type: string
          description: Short human-readable name for a picker.
        description:
          type: string
          description: One-line explanation for a picker.
        takesModel:
          type: boolean
          description: Whether a create request for this type may carry `model`. A model on a type where this is false is rejected with 400.
        takesPlugins:
          type: boolean
          description: Whether a create request for this type may carry `plugins` (AC-L1). A plugin list on a type where this is false is rejected with 400.
        input:
          type: string
          enum: [prompt, terminal]
          description: >
            How the session is driven. `terminal` writes keystrokes to a PTY and
            reads a terminal screen; `prompt` writes whole prompts to a serial
            agent queue and reads its text stream.
        approvalGate:
          type: boolean
          description: >
            Whether sessions of this type run behind the approval gate
            (docs/prd/approval-gate.md AC-F2~F6): a session-scoped helper pod,
            workload egress confined to it, and a human decision before every
            external tool call. A capability of the type, not a type of its
            own — clients render the gated workspace from this flag rather
            than from a type name.
        defaultModel:
          type: string
          nullable: true
          maxLength: 128
          description: >
            Same meaning as `ClaudeCodeConfig.defaultModel` for this type: the
            concrete ConfigMap-backed default, or `platform-default`. `null`
            exactly when `takesModel` is false.
        models:
          type: array
          uniqueItems: true
          description: Same meaning as `ClaudeCodeConfig.models` for this type. Always empty when `takesModel` is false.
          items:
            type: string
        reasoningEfforts:
          type: array
          uniqueItems: true
          description: >
            The values a create request's `reasoningEffort` may take for this
            type, in display order (AC-E8). Empty when the type takes none — a
            create request carrying one is then rejected with 400.
          items:
            type: string
    TenantConfig:
      type: object
      additionalProperties: false
      required: [name, workloadTypes]
      properties:
        name: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$' }
        workloadTypes:
          type: array
          description: The tenant's granted types that this deployment offers, in display order.
          items: { $ref: "#/components/schemas/WorkloadType" }
    ClaudeCodeConfig:
      type: object
      additionalProperties: false
      required: [defaultModel, models]
      properties:
        defaultModel:
          type: string
          maxLength: 128
          pattern: '^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$'
          description: >
            Effective platform default shown by the UI: the concrete
            ConfigMap-backed model when configured, otherwise the stable
            `platform-default` session alias. Omitting model from a create
            request still records that stable alias so future pod starts follow
            the platform default.
        models:
          type: array
          uniqueItems: true
          description: >
            Ordered, rollout-scoped soft catalog for the UI. It never includes
            the reserved `platform-default` alias and is not an API allowlist.
            Empty means the UI should preserve its free-text model input.
          items:
            type: string
            pattern: '^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$'
    State:
      type: string
      enum: [active, idle, snapshot]
    WorkloadType:
      type: string
      enum: [shell, claude-code, minimax-code, codex-chat, codex-task]

      default: shell
      description: >
        Which data plane workload the session runs (AC-E1). Fixed at
        creation and immutable afterwards. `shell` is an interactive PTY shell
        (AC-D1~D5); `claude-code` is the Claude Code CLI workload (AC-E2~E6);
        `minimax-code` is the MiniMax Code CLI (`mcode`) on that same
        execution model, with its own provider Secret and ConfigMap, behind
        the approval gate — a workload pod plus a session-scoped helper pod
        (AC-G1~G6, docs/prd/approval-gate.md AC-F2~F6); `codex-chat` runs the Codex SDK on
        the same execution model, signs each session in to ChatGPT with a
        device code on its first prompt, and is limited to conversation,
        platform plugin skills and the K3s MCP (AC-J1~J7). Its old name `codex`
        is refused in requests; sessions stored under it are answered as `codex-chat`.
        `codex-task` runs the same SDK with a shell, files and network like
        `claude-code`, signed in through a login slot of the `codex-task` auth
        pool (AC-M1~M4, AC-N1~N5). Each non-default type requires the control plane

        to have an image configured for it, and creating a session of a type
        with no configured image fails rather than falling back to a shell.
    Checkpoint:
      type: object
      properties:
        ref: { type: string }
        sizeBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        reclaimed: { type: string }
    Session:
      type: object
      required: [id, name, state, workloadType, createdAt, lastAccess]
      properties:
        id: { type: string }
        name: { type: string }
        workloadType: { $ref: "#/components/schemas/WorkloadType" }
        tenant:
          type: string
          description: >
            Owning tenant, fixed at creation (AC-K2). Absent for an
            operator-owned session, including every session created before
            tenancy existed.
        state: { $ref: "#/components/schemas/State" }
        model:
          type: string
          description: >
            Immutable model identifier for the agent workload types. Present
            for `claude-code`, `minimax-code`, `codex-chat` and `codex-task`, which share
            this contract (AC-E6, reused by AC-G1); omitted at creation resolves to

            `platform-default`.
            Whenever the primary container starts, including a restart, that
            alias resolves through the optional ConfigMap model and then the CLI
            fallback.
        plugins:
          type: array
          items: { type: string }
          description: >
            The session's marketplace plugin selection, fixed at creation and
            carried across snapshot/restore (AC-L1). Absent when the session was
            created without one and runs its type's platform-default plugins.
        reasoningEffort:
          type: string
          description: >
            Immutable reasoning effort, present only when the create request
            named one (AC-E8). `claude-code` takes low, medium, high, xhigh or
            max; `codex-task` takes minimal, low, medium, high or xhigh (AC-M4).
            Absent means the CLI's own default. A restore keeps it.
        doubleMemory:
          type: boolean
          description: >
            Whether the workload container runs with doubled memory
            request/limit over the platform default, fixed at creation and
            carried across snapshot/restore. Absent or false means the
            platform default; applies to every workload type.
        pod:
          type: string
          description: >
            The session's dedicated workload pod — the 1:1 subject of AC-A2.
            Absent while the session is snapshotted and its pods reclaimed.
        auxiliaryPods:
          type: array
          items: { type: string }
          description: >
            Session-scoped pods that serve the workload pod without running the
            workload themselves (AC-A2's auxiliary-pod clause). They share the
            workload pod's lifetime and are reclaimed with it, so this is absent
            exactly when `pod` is. `shell`, `claude-code`, `codex-chat` and `codex-task`
            sessions provision none; a session of a type behind the approval gate
            (`minimax-code`) lists its one helper pod here (AC-F4).

        createdAt: { type: string, format: date-time }
        lastAccess: { type: string, format: date-time }
        checkpoint: { $ref: "#/components/schemas/Checkpoint" }
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Leading and trailing whitespace is trimmed; at least one non-whitespace character is required.
        workloadType:
          allOf:
            - $ref: "#/components/schemas/WorkloadType"
          description: >
            Optional. Omitted means `shell`, so a request that predates the
            workload type axis behaves unchanged. Any value outside the enum,
            including `codex-chat`'s old name `codex` (AC-J1), is rejected with 400 before any pod is provisioned.
        model:
          type: string
          pattern: '^(~[A-Za-z0-9][A-Za-z0-9._:/-]{0,126}|[A-Za-z0-9][A-Za-z0-9._:/-]{0,127})$'
          description: >
            Model for this session. Valid when workloadType is `claude-code`,
            `minimax-code`, `codex-chat` or `codex-task`; omitted resolves to `platform-default`. A concrete

            value is passed literally and takes precedence over the platform
            ConfigMap default. The catalog returned by GET /config is advisory,
            not an allowlist. Credentials are never accepted in this request.
        plugins:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: >
            Optional marketplace plugins for this session (AC-L1), by plugin name
            in the platform marketplace (no `@marketplace` suffix). Valid when
            workloadType is `claude-code`, `minimax-code`, `codex-chat` or
            `codex-task`. Omitted, the session gets its type's platform default
            (`session-platform` for claude-code, the deployment's `CODEX_PLUGINS`
            for codex-chat and `CODEX_TASK_PLUGINS` for codex-task,
            `mcp-servers` for minimax-code). Given, it replaces that default
            outright — list the default too if the session should keep it.
            Names are not checked against the marketplace here: a name it does
            not list fails the pod's plugin bootstrap, which for `claude-code`
            fails the create (its agent never becomes reachable) and for
            `codex-chat`/`codex-task`/`minimax-code` leaves the session running without plugins,
            as any marketplace failure already does. `minimax-code` registers
            its K3s MCP server only from a selected plugin that declares it, so
            a failed bundle, or a list without such a plugin (default
            `mcp-servers`), leaves it without K3s tools too. The selection is
            installed again on every restore: a `claude-code` session whose
            plugin has since left the marketplace cannot be restored. `null`, an empty list, a duplicate or an
            invalid name → 400, as is a list on `shell`.
        doubleMemory:
          type: boolean
          description: >
            Optional. Doubles the workload container's memory request/limit
            over the platform default (currently 512Mi/1Gi -> 1Gi/2Gi),
            fixed at creation and carried across snapshot/restore. Omitted or
            false keeps every existing client's behavior unchanged; applies
            to every workload type. A non-boolean value is rejected with 400
            before any pod is provisioned.
        reasoningEffort:
          type: string
          minLength: 1
          description: >
            Optional reasoning effort, fixed at creation (AC-E8). It must be one
            of the type's `reasoningEfforts` from GET /config; a type with none,
            an empty string, a non-string or an unlisted value is rejected with
            400 before any pod is provisioned.
        tenant:
          type: string
          minLength: 1
          description: >
            Operator only: the configured tenant the session is created for
            (AC-K2). A tenant caller may omit it or name itself; its sessions
            always belong to it. Unknown tenant → 400; a type the owning tenant
            is not granted → 403.
    WriteRequest:
      type: object
      additionalProperties: false
      properties:
        payload:
          type: string
          description: >
            Raw workload input. Agent workload writes (claude-code,
            minimax-code, codex-chat, codex-task) are limited to 1 MiB of UTF-8 bytes

            per prompt; larger writes return 413.
    ReadRequest:
      type: object
      additionalProperties: false
      properties:
        offset:
          type: integer
          format: int64
          default: 0
          minimum: 0
          description: >
            Cursor issued as nextOffset by a previous read or output/reset
            event for this session. Clients must use a server-issued cursor
            rather than a decoded string length. 0 (or omitted) returns the
            full output accumulated since session start (AC-D3); an offset past
            the current length yields an empty payload at the current cursor.
    ReadResult:
      type: object
      properties:
        session: { $ref: "#/components/schemas/Session" }
        path:
          type: string
          description: which state branch served the read
        payload:
          type: string
          description: >
            Text projection of workload output accumulated after the requested
            byte offset. Shell output is merged PTY stdout/stderr. Claude output
            is valid UTF-8: the ordered projection of partial assistant text
            deltas plus redacted diagnostic stderr; the CLI's stream-json
            envelopes are not exposed.
        nextOffset:
          type: integer
          format: int64
          description: >
            Server-issued byte cursor to pass as offset on the next read or
            stream request. For Claude output it is always a UTF-8 code-point
            boundary. Clients must use this value rather than calculating a
            JavaScript string length.
    WriteResult:
      type: object
      properties:
        session: { $ref: "#/components/schemas/Session" }
        path:
          type: string
          description: which state branch served the write
    PluginRefreshResult:
      type: object
      required: [session, path, state, added, updated, removed]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        path:
          type: string
          description: Which state branch served the refresh, as for a write (e.g. `active`, `snapshot->restore->refresh-plugins`).
        state:
          type: string
          enum: [ready, unconfigured]
          description: "`unconfigured`: the session has no plugin marketplace (no K3s MCP token), so there was nothing to fetch."
        revision:
          type: string
          description: The marketplace commit the skills now come from, when known.
        added:
          type: array
          items: { type: string }
          description: Platform-managed skill directories (`<plugin>--<skill>`) the refresh installed.
        updated:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
    RepoRef:
      type: object
      additionalProperties: false
      required: [repo]
      properties:
        repo:
          type: string
          description: "`owner/repo`; case and a trailing `.git` are normalized away"
          example: dlddu/infrastructure
    AllowlistEntry:
      type: object
      required: [repo, source, addedAt]
      properties:
        repo: { type: string }
        source: { type: string, enum: [manual, request] }
        requestSessionId: { type: string, description: Set when source is request }
        addedAt: { type: string, format: date-time }
    AccessRequest:
      type: object
      required: [id, repo, sessionId, reason, requestedAt, alreadyAllowed]
      properties:
        id: { type: string }
        repo: { type: string }
        sessionId: { type: string }
        sessionName: { type: string, description: Absent once the session is gone }
        workloadType: { $ref: "#/components/schemas/WorkloadType" }
        reason: { type: string }
        requestedAt: { type: string, format: date-time }
        alreadyAllowed: { type: boolean }
    RepoAccessState:
      type: object
      required: [allowlist, requests]
      properties:
        allowlist:
          type: array
          items: { $ref: "#/components/schemas/AllowlistEntry" }
        requests:
          type: array
          items: { $ref: "#/components/schemas/AccessRequest" }
