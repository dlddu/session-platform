# In-cluster kubeconfig for workload pods (KUBECONFIG in data-plane/Dockerfile).
#
# kubectl only falls back to the pod's ServiceAccount when it has no kubeconfig
# *and* no client override, so a flag such as --request-timeout sent it to
# localhost:8080 instead. Naming the same in-cluster settings explicitly makes
# every invocation use the ServiceAccount. tokenFile is re-read on each run, so
# the rotating projected token keeps working.
apiVersion: v1
kind: Config
clusters:
  - name: in-cluster
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
users:
  - name: service-account
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
contexts:
  - name: in-cluster
    context:
      cluster: in-cluster
      user: service-account
current-context: in-cluster
