name: e2e

# Full-stack e2e against a kind-deployed SUT (deploy/): build the combined
# control-plane image and the data plane agent image, load them into kind,
# apply the manifests, then run the Go API suite and the Playwright browser
# suite against the NodePort-exposed control-plane.
#
# Path-filtered to control-plane, data-plane, web, deploy/k8s manifests,
# e2e scripts, Makefile, and this workflow (plus on-demand). Unrelated PRs do
# not trigger it; the lint/unit/build jobs in ci.yml still run on every PR.
on:
  pull_request:
    paths:
      - "control-plane/**"
      - "data-plane/**" # session pods run this multi-workload agent image
      - "web/**"
      - "deploy/**"
      - "k8s/**" # deploy/ overlay builds on the k8s/ base
      - "scripts/e2e/**"
      - "Makefile"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (kind + API + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Creates a kind cluster from deploy/kind-config.yaml (installs kind +
      # kubectl on the runner). cluster_name matches the config so the
      # idempotent make e2e-up below reuses it instead of recreating.
      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.24.0
          cluster_name: session-platform
          config: deploy/kind-config.yaml

      # Build the combined image, load it into kind, apply deploy/, wait for the
      # rollouts, and poll the SUT at http://localhost:8080 (host :8080 -> node
      # :30080 via the extraPortMapping). No port-forward needed.
      - name: deploy SUT
        run: make e2e-up

      # PROBE (informational, non-blocking): can the agent's in-pod CRIU actually
      # run here? Since checkpoint/restore moved into the agent (it execs criu
      # itself, docs/criu-verification.md decision ⑤), kind no longer needs a
      # CRIU-capable *runtime* — only a capable kernel and a privileged pod. This
      # step exposes that preflight signal on a GitHub runner's kernel with
      # kind's nested containers. The deploy overlay enables the CRIU gate and
      # the round trip is driven by the *product* snapshot endpoint (there is no
      # test-only trigger any more — manual archiving promoted it), so
      # the AC-B2/B3/D4 e2e files are the authoritative real round-trip
      # assertions. continue-on-error keeps this duplicate diagnostic from hiding
      # that API-test verdict.
      - name: CRIU probe (in-pod criu viability on this runner)
        continue-on-error: true
        run: |
          set -o pipefail
          kubectl delete pod criu-probe --ignore-not-found
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: criu-probe
          spec:
            restartPolicy: Never
            containers:
              - name: probe
                # The data plane agent image, loaded into kind by make e2e-up; it
                # carries the source-built criu the agent uses.
                image: session-platform/data-plane:dev
                imagePullPolicy: IfNotPresent
                command:
                  - sh
                  - -c
                  - |
                    set -x
                    /usr/local/sbin/criu --version
                    # The pid-floor guard writes this before forking the shell.
                    echo 300 > /proc/sys/kernel/ns_last_pid && echo "ns_last_pid: writable"
                    # Extra signal only; --all includes experimental features and
                    # may fail on a perfectly usable kernel.
                    /usr/local/sbin/criu check --all 2>&1 || echo "check --all: not clean (informational)"
                    # The verdict: plain check must pass for in-pod CRIU.
                    /usr/local/sbin/criu check 2>&1
                securityContext:
                  privileged: true
          EOF
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/criu-probe --timeout=120s \
            || kubectl wait --for=jsonpath='{.status.phase}'=Failed pod/criu-probe --timeout=10s \
            || true
          echo "--- probe output ---"
          kubectl logs criu-probe || true
          phase=$(kubectl get pod criu-probe -o jsonpath='{.status.phase}' 2>/dev/null || echo Unknown)
          echo "--- probe pod phase: $phase ---"
          kubectl delete pod criu-probe --ignore-not-found
          # Non-zero marks the step (not the job) red when criu is unusable here.
          [ "$phase" = "Succeeded" ]

      - name: API e2e (go, -tags=e2e)
        working-directory: control-plane
        env:
          E2E_BASE_URL: http://localhost:8080
        # -timeout is explicit because go's default is 10 minutes *per package*
        # and this one package provisions a pod per test. The claude-code tests
        # add cold CLI invocations on top of that, so the default stopped being
        # a safe bound; 30m fails a genuinely stuck suite without failing a slow
        # runner. The job itself is still bounded by the workflow default.
        run: go test -tags=e2e -timeout=30m -v ./test/...

      - name: install web deps
        working-directory: web
        run: npm ci

      - name: install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: browser e2e (playwright)
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

      - name: SUT diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe deploy/control-plane || true
          kubectl logs deploy/control-plane --tail=200 || true
