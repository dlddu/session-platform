# PR 체크의 단일 진입점. 브랜치 보호(main ruleset)가 요구할 이 워크플로의 체크는 `pr-gate` 하나다.
#
#   changes ──┬─ test   -> test.yml   이미지 없이 도는 검사 전부 (바로 시작)
#             └─ e2e    -> e2e.yml    SUT 경로가 바뀐 PR 만 — `image` 를 기다려 그 이미지로 kind e2e
#   image     -> image.yml  PR head SHA 로 이미지 발행 (pin 은 main push 에서만)
#   pr-gate   위 전부의 판정을 하나로
#
# e2e 가 image 뒤인 이유: kind e2e 가 레지스트리에 올라간 *바로 그 이미지*를 pull 해 쓰므로,
# 테스트한 것과 배포되는 것(프리뷰도 같은 태그)이 같은 바이트다. 러너마다 이미지를 따로 빌드하던
# 예전 구조보다 빌드가 한 번으로 줄었다.
#
# PR 에서만 돈다. main push 에서는 테스트를 다시 돌리지 않는다 — main 에 들어오는 커밋은 이미
# PR 에서 `pr-gate` 를 통과했다. main 에서는 image.yml 이 자기 push 트리거로 단독 실행돼 발행 +
# pin 만 한다. 수동 전체 실행은 PR 을 다시 열거나 빈 커밋을 올린다.
#
# 경로 필터는 워크플로 트리거가 아니라 `changes` 잡이 판정하므로, 해당 없는 잡은 "실행 안 됨"이
# 아니라 skipped 로 남고 pr-gate 가 그 skipped 를 판정에 넣는다.
#
# 체크 추가: job 을 만들고(또는 workflow_call 파일을 불러) `pr-gate.needs` 에 넣는다.
# 브랜치 보호 설정은 건드리지 않는다.
name: PR

on:
  pull_request:

permissions:
  contents: read

# PR 에 새 push 가 오면 이전 실행을 취소한다.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes (path filter)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter 가 PR 변경 파일을 API 로 읽는다
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      journey: ${{ steps.filter.outputs.journey }}
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            e2e:
              - "control-plane/**"
              - "data-plane/**"
              - "web/**"
              - "deploy/**"
              - "scripts/e2e/**"
              - "Makefile"
              - ".github/workflows/e2e.yml"
              - ".github/workflows/image.yml"
              - ".github/workflows/pr.yml"
            journey:
              - "docs/journeys/**"
              - "docs/user-journeys/**"
              - "docs/mockups/README.md"
              - "docs/index.html"
              - "docs/doc-structure-state.md"
              - "tools/**"
              - ".github/workflows/test.yml"
      # journey 잡의 Playwright 컨테이너 태그를 하네스 락파일에서 읽는다. 태그를 손으로
      # 박아 두면 의존성 갱신 때 브라우저 빌드와 라이브러리 버전이 조용히 어긋난다.
      - id: pw
        run: |
          v=$(node -p "require('./tools/package-lock.json').packages['node_modules/@playwright/test'].version")
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tools/package-lock.json 에서 @playwright/test 버전을 못 읽음: '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  image:
    uses: ./.github/workflows/image.yml
    # GitHub 는 실행 전에 호출되는 워크플로의 *모든* job 권한을 검증한다. pin job 은 PR 에서
    # 조건상 skip 되지만 contents: write 를 선언하므로, 호출하는 쪽 상한도 그만큼 열어야 한다.
    # image.yml 은 자기 기본값을 contents: read 로 다시 좁힌다.
    permissions:
      contents: write
      packages: write

  test:
    needs: [changes]
    uses: ./.github/workflows/test.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      journey: ${{ needs.changes.outputs.journey == 'true' }}
      playwright: ${{ needs.changes.outputs.playwright }}

  e2e:
    needs: [changes, image]
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      packages: read

  # 브랜치 보호의 required status check 로 거는 이 워크플로의 **유일한** 이름이다.
  #
  # `if: always()` 는 빼면 안 된다: 선행 job 이 실패하면 이 job 은 기본적으로 skipped 가 되고,
  # GitHub 는 skipped 인 required check 를 통과로 친다 — 게이트가 가장 필요한 순간에 열린다.
  # 그래서 항상 돌리고, 선행 job 이 하나라도 success 가 아니면 실패한다. 예외는 경로 필터가
  # 끈 e2e 하나뿐이다(changes 가 성공했고 e2e 대상이 아니라고 판정했을 때의 skipped).
  pr-gate:
    name: pr-gate
    if: always()
    needs: [changes, image, test, e2e]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Require every upstream job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS" | jq -e '
              (.changes.result == "success") and
              all(to_entries[] | select(.key != "e2e"); .value.result == "success") and
              (.e2e.result == "success" or
               (.e2e.result == "skipped" and .changes.outputs.e2e != "true"))' > /dev/null; then
            echo "::error::성공하지 않은 선행 job 이 있다 — 위 목록 참조"
            exit 1
          fi
