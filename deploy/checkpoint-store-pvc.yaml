# kind e2e ONLY: the checkpoint archive store for the CRIU round trip.
#
# The agent-driven checkpointer streams each archive out of the session pod (which
# is reclaimed immediately after) and back into the restore pod, so it needs a
# store that outlives the session pod. There is no S3 in kind, so the control
# plane uses a local directory (CHECKPOINT_DIR) backed by this volume.
#
# It must be SHARED by both control-plane replicas: the Service may route the
# snapshot to one replica and the restoring access to the other. kind's default
# local-path StorageClass binds with WaitForFirstConsumer, so the PV lands on the
# node of the first replica scheduled and the second replica is then scheduled to
# that same node (PV node affinity) — both mount the same directory. ReadWriteOnce
# permits multiple pods on one node (unlike ReadWriteOncePod).
#
# Production does not use this overlay: it points CHECKPOINT_S3_* at real S3.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoint-store
  labels:
    app: control-plane
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
