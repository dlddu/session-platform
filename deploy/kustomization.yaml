# Overlay for the kind-based e2e SUT. Reuses the production base (../k8s) and
# applies only the kind-specific differences:
#   - the locally built control-plane image (loaded via `kind load`, not pulled
#     from ghcr),
#   - a NodePort Service so the e2e suites reach the SUT at host :8080 through the
#     kind extraPortMapping (deploy/kind-config.yaml),
#   - 2 control-plane replicas so the e2e suite exercises cross-replica state
#     sharing through the ConfigMap/Lease store (AC-C1). The production base
#     keeps replicas: 1; scaling production is a separate operational decision.
#
# kind-config.yaml is a kind CLI config (not a Kubernetes resource) and is
# intentionally NOT part of this kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
  # The `checkpoint-s3` Secret the control plane requires, pointed at the
  # in-cluster MinIO below (production uses the k8s/ base + external-secrets).
  - checkpoint-s3-secret.yaml
  # Throwaway credentials for creating claude-code pods in local e2e.
  - claude-code-credentials-secret.yaml

  # S3-compatible backend for the CRIU checkpoint archives, so the round trip
  # runs against the real S3 code path with no cloud account.
  - minio.yaml
images:
  - name: ghcr.io/dlddu/session-platform
    newName: session-platform/control-plane
    newTag: dev
patches:
  # The production ClusterRoleBindings target the session-platform namespace;
  # this overlay deploys the same data-plane ServiceAccount into `default`.
  - target:
      kind: ClusterRoleBinding
      name: session-platform-data-plane-view
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: default
  - target:
      kind: ClusterRoleBinding
      name: session-platform-data-plane-node-read
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: default
  - target:
      kind: Service
      name: control-plane
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  # The image is loaded into kind (`kind load`), so never reach for a registry;
  # run 2 replicas so the e2e suite drives cross-replica atomicity (AC-C1)
  # against the shared ConfigMap/Lease store; and point DATA_PLANE_IMAGE at the
  # locally built agent image scripts/e2e/up.sh loads into kind (the base
  # references the ghcr-published tag). env/1 is DATA_PLANE_IMAGE, env/2 is
  # CRIU_ENABLED, and env/3 is DATA_PLANE_CLAUDE_CODE_IMAGE in the base.
  #
  # CRIU is turned ON here: since checkpoint/restore moved into the agent
  # (docs/criu-verification.md decision ⑤) it needs no CRIU-capable *runtime*,
  # only a capable kernel and a privileged session pod — and the e2e CRIU probe
  # confirms that holds on GitHub runners. That makes the AC-D4 round trip an
  # automated assertion (TestDeferred_CRIUIntegrity) instead of a manual round.
  # It also needs: a snapshot trigger reachable over HTTP (E2E_TEST_ENDPOINTS,
  # test-only — the 60-minute idle reaper is the product path; finer trigger
  # timing remains an operational policy) and an archive store
  # shared by both replicas (CHECKPOINT_S3_ENDPOINT → the in-cluster MinIO,
  # authenticated with the static keys from the checkpoint-s3 Secret since no
  # role is set here).
  - target:
      kind: Deployment
      name: control-plane
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: session-platform/data-plane:dev
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: session-platform/data-plane:dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: E2E_TEST_ENDPOINTS
          value: "1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CHECKPOINT_S3_ENDPOINT
          value: http://minio:9000
      # No role is set in this SUT, so the store uses these ambient credentials
      # directly (they are also MinIO's root user).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: checkpoint-s3
              key: access-key
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: checkpoint-s3
              key: secret-key
