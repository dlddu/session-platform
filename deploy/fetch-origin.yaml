# kind e2e: the in-cluster origin an approved `web_fetch_get` actually fetches.
#
# 이것은 승인된 모킹 예외가 **아니다.** 정의의 EXT 배제 조항이 그대로 걸린다 — 정적 문서를 내는
# 평문 http 원본은 클러스터에 실물로 세울 수 있고, 세울 수 있으면 EXT 를 쓸 수 없다. 같은 근거로
# `deploy/minio.yaml`(S3 의 실물 구현)과 `deploy/plugin-marketplace-git.yaml`(진짜 git 원격)이
# 허용목록 밖에 있다. 반대로 `e2e-anthropic-fake.yaml`·`e2e-approval-gateway-fake.yaml` 이 등재된
# 것은 그쪽에는 세울 실물이 아예 없기 때문이다(그 서비스의 본체가 모델이고, 승인 API 서버는 PRD 가
# 지목한 참조 구현에 없다). 여기서 대신하는 것은 **아무것도 없다**: 도구는 프로덕션 코드 그대로
# `http.DefaultClient` 로 GET 하고, 이 원본은 그 GET 을 프로덕션 서버가 하는 일 그대로 받는다.
#
# 왜 평문 http 인가: MCP 컨테이너의 fetch 는 시스템 루트만 신뢰하는 기본 클라이언트이고 그
# 컨테이너에는 사설 발급자를 넣을 자리가 없다(credential-proxy 가 optional `ca-cert` 로 하는 일을
# 여기서는 할 수 없다 — helper pod spec 이 넣는 env 에 CA 자리가 없다). #129 로 `validateFetchTarget`
# 이 `http` 와 `https` 를 함께 받게 되면서 그 고리가 끊겼다: 평문 http 원본에는 **검증할 인증서가
# 애초에 없다.** 같은 `session-mcp` 컨테이너가 이미 평문 http 인클러스터 주소로 나가고 있다
# (`$APPROVAL_GATEWAY_URL` = `http://approval-gateway-fake:8080`).
#
# 호출 관찰도 치환을 들이지 않는다 — **원본 자신의 액세스 로그**가 그 GET 을 센다. `/access-log`
# 는 그 로그를 JSON 으로 읽는 창구일 뿐이고, 자기 자신과 `/healthz` 는 기록하지 않는다. 그래야
# 「결정 전 무도달」이 글자 그대로 0건이 된다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fetch-origin
  labels:
    app: fetch-origin
data:
  server.js: |
    // A static document served over plain HTTP, plus the origin's own access log.
    //
    //   GET /doc[/<key>]       -> 200 text/plain, the document below (logged)
    //   GET /large-doc[/<key>] -> 200 text/plain, 128 KiB (logged)
    //   GET /access-log        -> 200 application/json, [{method, url, at}, ...]
    //   GET /healthz           -> 200 text/plain
    //
    // The trailing key is free-form and is carried into the log verbatim, so a
    // caller can pick out its own requests: one origin serves the whole cluster
    // and two suites may run against it, so "exactly once" has to mean "exactly
    // once for this session" — the same scoping the gateway stand-in gets from
    // its externalId. It rides in the path rather than a query string because
    // the URL travels to the tool through a prompt, and a path segment carries
    // no character that anything on that trip would try to expand.
    const http = require("http");

    const PORT = Number(process.env.PORT || 8080);
    const DOCUMENT =
      process.env.DOCUMENT ||
      "session-platform e2e fetch origin\n" +
        "\n" +
        "이 문서는 승인된 web_fetch_get 이 실제로 가져가는 본문이다.\n" +
        "내용 자체에는 의미가 없고, 이 바이트열이 도구 결과로 돌아간다는 것만이 의미다.\n";
    const LARGE_DOCUMENT = Buffer.alloc(
      128 * 1024,
      "session-platform e2e large fetch origin\n",
    );

    // Every request this origin served, in order. Bounded so a long-running
    // cluster cannot grow it without limit; e2e reads it within one session.
    const MAX_ENTRIES = 1000;
    const accessLog = [];

    function record(req) {
      if (accessLog.length >= MAX_ENTRIES) accessLog.shift();
      accessLog.push({
        method: req.method,
        url: req.url,
        at: new Date().toISOString(),
      });
    }

    const server = http.createServer((req, res) => {
      const path = (req.url || "/").split("?")[0];

      // Reading the log is not a visit to the origin, and neither is the
      // kubelet's probe. Logging either would make "nothing reached it" false
      // for reasons that have nothing to do with the session under test.
      if (path === "/access-log") {
        const body = JSON.stringify(accessLog);
        res.writeHead(200, {
          "Content-Type": "application/json",
          "Content-Length": Buffer.byteLength(body),
        });
        res.end(body);
        return;
      }
      if (path === "/healthz") {
        res.writeHead(200, { "Content-Type": "text/plain" });
        res.end("ok\n");
        return;
      }

      record(req);

      const large = path === "/large-doc" || path.startsWith("/large-doc/");
      if (large || path === "/doc" || path.startsWith("/doc/")) {
        const body = large ? LARGE_DOCUMENT : DOCUMENT;
        res.writeHead(200, {
          "Content-Type": "text/plain; charset=utf-8",
          "Content-Length": Buffer.byteLength(body),
        });
        res.end(body);
        return;
      }

      // A miss is still a visit — it is recorded above, so a caller that asked
      // for the wrong path sees that it arrived rather than seeing silence.
      res.writeHead(404, { "Content-Type": "text/plain" });
      res.end("not found\n");
    });

    server.listen(PORT, "0.0.0.0", () => {
      console.log("fetch-origin listening on " + PORT);
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetch-origin
  labels:
    app: fetch-origin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fetch-origin
  template:
    metadata:
      labels:
        app: fetch-origin
    spec:
      # The data-plane image carries the Node 22 runtime and kind already has it
      # loaded — no extra build, no pull. Same reasoning as the marketplace remote.
      #
      # One replica on purpose: the access log lives in this process, so a second
      # replica would split it and "exactly once" would depend on which pod the
      # Service picked.
      containers:
        - name: origin
          image: session-platform/data-plane:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/fetch-origin/server.js"]
          env:
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          volumeMounts:
            - name: server
              mountPath: /opt/fetch-origin
      volumes:
        - name: server
          configMap:
            name: fetch-origin
---
apiVersion: v1
kind: Service
metadata:
  name: fetch-origin
  labels:
    app: fetch-origin
spec:
  selector:
    app: fetch-origin
  ports:
    - name: http
      port: 8080
      targetPort: 8080
