# kind e2e only. These throwaway values let the helper pod's session MCP
# container resolve the approval gateway triple (AC-F6). The keys are the
# literals the orchestrator asks for — url / api-key / user-id, see
# ApprovalGateway*SecretKey in control-plane/internal/adapter/k8s/
# client_orchestrator.go — and the Secret name is the code default
# (`approval-gateway-credentials`), so the overlay sets no APPROVAL_GATEWAY_SECRET
# env and k8s/ stays untouched.
#
# All three references are *required* SecretKeyRefs, not optional ones, so the
# kubelet fails the container's configuration when this Secret is missing and the
# helper pod never reaches Ready. That is why an approval-gated session could not
# stand in this SUT at all before this manifest existed — not a gateway timeout,
# a pod that was never configured.
#
# None of the values may be empty: newApprovalGateway (data-plane/cmd/agent/
# approval_gateway.go) refuses to build a gate from a blank field, and a session
# without a gate offers no external tool at all rather than an ungated one.
#
# Production provisions the same three keys out-of-band — flux-cd-apps'
# apps/session-platform/approval-gateway-credentials-external-secret.yaml syncs
# them from SSM — so this file is overlay-only by construction.
apiVersion: v1
kind: Secret
metadata:
  name: approval-gateway-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  # The in-cluster gateway stand-in the overlay deploys
  # (deploy/e2e-approval-gateway-fake.yaml, approved mock exception
  # APPROVAL-GATEWAY). Plain HTTP on purpose: the gateway client checks the four
  # values for non-emptiness and never looks at the scheme, so there is no https
  # requirement to satisfy here and no private CA to hand anyone.
  url: "http://approval-gateway-fake:8080"
  api-key: "e2e-approval-gateway-placeholder-not-a-real-key"
  # Who the gateway would notify. A platform-wide value, never per session.
  user-id: "e2e-approver"
