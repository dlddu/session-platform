# kind e2e only. These throwaway values let a Claude credential-proxy sidecar
# resolve its required Secret refs; the tool-running container never receives
# them, and hermetic tests never send them to an external API. Production
# provisions the same keys out-of-band.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  # Deliberately unroutable inside the cluster unless a test replaces it.
  base-url: "https://127.0.0.1:9"
  auth-token: "e2e-placeholder-not-a-real-token"
