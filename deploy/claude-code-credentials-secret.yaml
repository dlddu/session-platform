# kind e2e only. These throwaway values let the credential-proxy resolve its
# base-url/auth-token refs and the tool-running container resolve K3S_MCP_TOKEN.
# The tool-running container never receives the provider credentials, and
# hermetic tests never send any placeholder to an external API. The optional
# model value may be projected into the tool-running container for a
# platform-default session and into the control plane for UI display; the
# optional models catalog is also exposed there.
# Production provisions the same keys out-of-band.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  # The in-cluster provider stand-in the overlay deploys
  # (deploy/e2e-anthropic-fake.yaml, approved mock exception CLAUDE-PROVIDER).
  # It was `https://127.0.0.1:9` until 2026-09-04 — deliberately unroutable, so a
  # session could be created but never receive a reply.
  base-url: "https://anthropic-fake:8443"
  auth-token: "e2e-placeholder-not-a-real-token"
  k3s-mcp-token: "e2e-k3s-mcp-placeholder-not-a-real-token"
  # The two bootstrap endpoints the session pod reaches before the agent starts.
  # Both keys are optional in the production Secret; when absent the data plane
  # entrypoint falls back to the real organisation endpoints, so `k8s/` is
  # unaffected. Here they point at the in-cluster stand-ins the overlay deploys:
  #   - k3s-mcp-url          -> deploy/e2e-k3s-mcp-fake.yaml (approved mock
  #                             exception PLUGIN-CRED; the real service holds a
  #                             GitHub App private key that cannot be cloned)
  #   - plugin-marketplace-url -> deploy/plugin-marketplace-git.yaml (a real git
  #                             remote, not a mock — same code path as github.com)
  k3s-mcp-url: "http://k3s-mcp-fake:8080/mcp"
  plugin-marketplace-url: "http://plugin-marketplace-git:8080/plugin-marketplace.git"
  model: "claude-e2e-model"
  models: '["claude-e2e-model","claude-e2e-alternate"]'
  # Optional, non-credential: the issuer of the stand-in provider's certificate.
  # The credential proxy adds it to the system roots (it never replaces them), so
  # the proxy reaches an https endpoint no public store knows about while every
  # other part of AC-E6's round trip stays real — header allowlist, platform
  # token injection, and certificate verification. Production omits this key and
  # keeps the system pool, so k8s/ is unaffected.
  ca-cert: |
    -----BEGIN CERTIFICATE-----
    MIIByTCCAW+gAwIBAgIIU1BFMkVDQTEwCgYIKoZIzj0EAwIwRjEpMCcGA1UEAwwg
    c2Vzc2lvbi1wbGF0Zm9ybSBlMmUgcHJvdmlkZXIgQ0ExGTAXBgNVBAoMEHNlc3Np
    b24tcGxhdGZvcm0wIBcNMjYwOTA0MTUxMTE4WhgPMjA5NTAyMTQxNTExMThaMEYx
    KTAnBgNVBAMMIHNlc3Npb24tcGxhdGZvcm0gZTJlIHByb3ZpZGVyIENBMRkwFwYD
    VQQKDBBzZXNzaW9uLXBsYXRmb3JtMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE
    kps4xoOqergS1RkY8MxAY5c83+ISayov7C79DCg7AlavsxT10ArEtuIVQAtLLghA
    4BdlV1gnltJZ14atT1YOeaNFMEMwEgYDVR0TAQH/BAgwBgEB/wIBADAOBgNVHQ8B
    Af8EBAMCAQYwHQYDVR0OBBYEFLbHuuLT36UR7y04ezewQbSp4mckMAoGCCqGSM49
    BAMCA0gAMEUCIQDEZnJHixg+RYdNxzaK68zcvqOz28ksuDK6gRmAIt7a2AIgM9rR
