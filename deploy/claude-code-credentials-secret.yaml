# kind e2e only. These throwaway values let the credential-proxy resolve its
# base-url/auth-token refs and the tool-running container resolve K3S_MCP_TOKEN.
# The tool-running container never receives the provider credentials, and
# hermetic tests never send any placeholder to an external API. The optional
# model value may be projected into the tool-running container for a
# platform-default session and into the control plane for UI display; the
# optional models catalog is also exposed there.
# Production provisions the same keys out-of-band.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  # Deliberately unroutable inside the cluster unless a test replaces it.
  base-url: "https://127.0.0.1:9"
  auth-token: "e2e-placeholder-not-a-real-token"
  k3s-mcp-token: "e2e-k3s-mcp-placeholder-not-a-real-token"
  model: "claude-e2e-model"
  models: '["claude-e2e-model","claude-e2e-alternate"]'
