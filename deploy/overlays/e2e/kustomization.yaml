# Overlay for the kind-based e2e SUT. Reuses the production base (../../base) and
# applies only the kind-specific differences:
#   - the locally built control-plane image (loaded via `kind load`, not pulled
#     from ghcr),
#   - a NodePort Service so the e2e suites reach the SUT at host :8080 through the
#     kind extraPortMapping (deploy/overlays/e2e/kind-config.yaml),
#   - 2 control-plane replicas so the e2e suite exercises cross-replica state
#     sharing through the ConfigMap/Lease store (AC-C1). The production base
#     keeps replicas: 1; scaling production is a separate operational decision.
#
# kind-config.yaml is a kind CLI config (not a Kubernetes resource) and is
# intentionally NOT part of this kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # The `checkpoint-s3` ConfigMap the control plane requires, pointed at the
  # in-cluster MinIO below, plus the MinIO root credentials Secret
  # (production uses the deploy/base/ base + external-secrets, and no credentials).
  - checkpoint-s3.yaml
  # Throwaway claude-code configuration (ConfigMap) and credentials (Secret)
  # for creating claude-code pods in local e2e.
  - claude-code.yaml
  # The same for minimax-code, the type the approval gate's e2e runs on. Its
  # provider proxy reaches the same in-cluster provider stand-in.
  - minimax-code.yaml

  # S3-compatible backend for the workload archives, so the round trip
  # runs against the real S3 code path with no cloud account.
  - minio.yaml

  # The two endpoints a claude-code session pod reaches during its plugin
  # bootstrap, before the agent starts. Without them the pod dies in
  # entrypoint.sh and no claude-code session can exist in the SUT.
  #   - the K3s MCP stand-in is an approved mock exception (PLUGIN-CRED, EXT):
  #     the real service holds an organisation GitHub App private key.
  #   - the marketplace git remote is a *real* remote, deployed like MinIO, so
  #     `claude plugin marketplace add` runs its production code path.
  - e2e-k3s-mcp-fake.yaml
  - plugin-marketplace-git.yaml

  # The provider endpoint a claude-code session reaches *after* it is running.
  # Without it the session pod stands but every prompt dies against an
  # unroutable base-url, which is why AC-E2~E6 had no e2e at all. It is an
  # approved mock exception (CLAUDE-PROVIDER, EXT): unlike MinIO there is no
  # real implementation to deploy — the service *is* the model.
  - e2e-anthropic-fake.yaml

  # The approval gateway a gated session's helper pod asks before every
  # external tool call (docs/prd/approval-gate.md AC-F3): the real PocketAide server, built from source by
  # scripts/e2e/up.sh, at the same in-cluster address production uses, so the
  # base APPROVAL_GATEWAY_URL needs no patch. Only its IdP is a stand-in
  # (POCKET-AIDE-IDP, EXT) — see the file's header.
  - e2e-pocket-aide.yaml

  # The origin an approved `web_fetch_get` actually fetches. Not a mock
  # exception: a static document over plain HTTP can be deployed for real here,
  # and the definition's EXT clause says that when it can, EXT may not be used —
  # the same reason MinIO and the marketplace remote sit outside the allowlist.
  # Without it the approval path could only be observed as far as the gate,
  # because the target URL named a host that does not exist in this cluster.
  - fetch-origin.yaml

  # The file-share service a session MCP's drop_upload/drop_download reach: the
  # real drop server, built from source by scripts/e2e/up.sh, with its real
  # ServiceAccount exchange (TokenReview against this cluster). Nothing in it is
  # substituted, so it sits outside the allowlist like MinIO — see its header.
  - e2e-drop.yaml

  # Tenants for docs/test/multitenancy.md: two tenant ServiceAccounts, one
  # ServiceAccount no tenant claims, the tenant ConfigMap the base projects into
  # SESSION_PLATFORM_TENANTS, and the TokenReview grant production keeps in
  # flux-cd-apps. Nothing is substituted — the e2e suites mint real projected
  # tokens for these accounts.
  - e2e-tenancy.yaml

  # The ReadWriteMany class AC-F5's session-shared volume is provisioned from.
  # kind's default class is node-local and refuses a ReadWriteMany claim, so
  # without this the volume cannot stand here at all — see the file's header
  # and the env below.
  - shared-volume-provisioner.yaml
images:
  - name: ghcr.io/dlddu/session-platform
    newName: session-platform/control-plane
    newTag: dev
patches:
  # The production ClusterRoleBindings target the session-platform namespace;
  # this overlay deploys the same data-plane ServiceAccount into `default`.
  - target:
      kind: ClusterRoleBinding
      name: session-platform-data-plane-view
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: default
  - target:
      kind: ClusterRoleBinding
      name: session-platform-data-plane-node-read
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: default
  - target:
      kind: Service
      name: control-plane
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  # The image is loaded into kind (`kind load`), so never reach for a registry;
  # run 2 replicas so the e2e suite drives cross-replica atomicity (AC-C1)
  # against the shared ConfigMap/Lease store; and point DATA_PLANE_IMAGE at the
  # locally built agent image scripts/e2e/up.sh loads into kind (the base
  # references the ghcr-published tag). env/1 is DATA_PLANE_IMAGE, env/2 is
  # SHELL_ARCHIVE_ENABLED, env/3 is DATA_PLANE_CLAUDE_CODE_IMAGE, env/12 is
  # DATA_PLANE_MINIMAX_CODE_IMAGE, env/14 is MINIMAX_CODE_ARCHIVE_ENABLED,
  # env/16 is DROP_URL, env/17 is DATA_PLANE_CODEX_IMAGE, env/22 is
  # DATA_PLANE_CODEX_TASK_IMAGE, env/26 is CODEX_TASK_AUTH_SLOTS, env/27 is
  # CLAUDE_CODE_AUTH_MODE, env/30 is
  # CODEX_TASK_AUTH_STORAGE_CLASS, env/33 is CODEX_CHAT_AUTH_SLOTS and env/34 is
  # CODEX_CHAT_AUTH_STORAGE_CLASS. Each replace past env/3 is preceded by a `test`
  # of the entry's name, so a reordered base fails the build instead of
  # silently flipping a different variable.
  #
  # The shell and minimax-code archive gates are pinned ON here (the base
  # turns them on too; pinning keeps e2e on the real path if the base flips), so the AC-D4 shell round trip runs as an automated
  # assertion (e2e_d4_process_tree_test.go) and gated (minimax-code) sessions freeze
  # through the same agent archive path production uses. That needs the product snapshot trigger
  # reachable over HTTP and an archive store
  # shared by both replicas (CHECKPOINT_S3_ENDPOINT → the in-cluster MinIO,
  # authenticated with the static keys from the checkpoint-s3-credentials Secret since no
  # role is set here).
  - target:
      kind: Deployment
      name: control-plane
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: session-platform/data-plane:dev
      - op: test
        path: /spec/template/spec/containers/0/env/2/name
        value: SHELL_ARCHIVE_ENABLED
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "true"
      - op: test
        path: /spec/template/spec/containers/0/env/14/name
        value: MINIMAX_CODE_ARCHIVE_ENABLED
      - op: replace
        path: /spec/template/spec/containers/0/env/14/value
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: session-platform/data-plane:dev
      # minimax-code 도 같은 로컬 빌드 에이전트 이미지다(base 와 같은 관계를 유지한다 —
      # 프로덕션도 claude-code 와 동일 이미지를 가리킨다). kind 에는 ghcr 태그가 로드되어
      # 있지 않으므로, 이 replace 가 없으면 이 타입의 세션만 ImagePullBackOff 로 갈린다.
      # 승인 게이트 e2e(docs/prd/approval-gate.md AC-F2~F6)가 이 타입으로 돈다.
      - op: test
        path: /spec/template/spec/containers/0/env/12/name
        value: DATA_PLANE_MINIMAX_CODE_IMAGE
      - op: replace
        path: /spec/template/spec/containers/0/env/12/value
        value: session-platform/data-plane:dev
      # AC-F5's file-exchange volume is opt-in on a class name, because which
      # class serves ReadWriteMany is a property of the target cluster and the
      # production base cannot know it. Naming the class this overlay deploys
      # is what makes a gated session here actually provision the
      # claim and mount it into both pods — the path the e2e suite asserts.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SESSION_SHARED_VOLUME_STORAGE_CLASS
          value: session-shared
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CHECKPOINT_S3_ENDPOINT
          value: http://minio:9000
      # No role is set in this SUT, so the store uses these ambient credentials
      # directly (they are also MinIO's root user).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: checkpoint-s3-credentials
              key: access-key
      # drop's in-cluster address here (deploy/overlays/e2e/e2e-drop.yaml). env/16 is DROP_URL;
      # production goes through an ExternalName and
      # Traefik, neither of which kind has.
      - op: test
        path: /spec/template/spec/containers/0/env/16/name
        value: DROP_URL
      - op: replace
        path: /spec/template/spec/containers/0/env/16/value
        value: http://drop.drop.svc.cluster.local
      # codex 도 같은 로컬 빌드 에이전트 이미지다. env/17 가 DATA_PLANE_CODEX_IMAGE.
      - op: test
        path: /spec/template/spec/containers/0/env/17/name
        value: DATA_PLANE_CODEX_IMAGE
      - op: replace
        path: /spec/template/spec/containers/0/env/17/value
        value: session-platform/data-plane:dev
      # codex-task 도 같은 이미지다(AC-M1). env/22 가 DATA_PLANE_CODEX_TASK_IMAGE. 풀 크기는 base 의
      # 2 그대로 — 슬롯 PVC 는 kind 기본 StorageClass(local-path)로 묶인다(AC-N1).
      - op: test
        path: /spec/template/spec/containers/0/env/22/name
        value: DATA_PLANE_CODEX_TASK_IMAGE
      - op: replace
        path: /spec/template/spec/containers/0/env/22/value
        value: session-platform/data-plane:dev
      # codex-task 풀 크기는 운영(base)과 따로 2로 고정한다(AC-N1) — 풀 고갈 시나리오가 슬롯 수만큼
      # 세션 파드를 띄우므로 kind 를 가볍게 둔다. env/26 가 CODEX_TASK_AUTH_SLOTS.
      - op: test
        path: /spec/template/spec/containers/0/env/26/name
        value: CODEX_TASK_AUTH_SLOTS
      - op: replace
        path: /spec/template/spec/containers/0/env/26/value
        value: "2"
      # claude-code 는 이 SUT 에서 게이트웨이 모드다(AC-E7) — 기존 claude-code e2e 는 공급자 대역
      # (deploy/overlays/e2e/e2e-anthropic-fake.yaml)을 credential-proxy 로 부른다. 실 구독 로그인은 e2e 밖이다.
      # env/27 가 CLAUDE_CODE_AUTH_MODE.
      - op: test
        path: /spec/template/spec/containers/0/env/27/name
        value: CLAUDE_CODE_AUTH_MODE
      - op: replace
        path: /spec/template/spec/containers/0/env/27/value
        value: gateway
      # base 는 운영 클러스터의 efs 를 슬롯 클래스로 고정한다. kind 에는 efs 가 없으므로 비워
      # 기본 StorageClass(local-path)로 묶는다(AC-N1). env/30 가 CODEX_TASK_AUTH_STORAGE_CLASS.
      - op: test
        path: /spec/template/spec/containers/0/env/30/name
        value: CODEX_TASK_AUTH_STORAGE_CLASS
      - op: replace
        path: /spec/template/spec/containers/0/env/30/value
        value: ""
      # codex-chat 슬롯 풀(AC-N6)도 같은 이유로 클래스를 비우고, codex 시나리오가 세션을 차례로
      # 만들고 지우는 동안 반납이 늦어도 막히지 않게 2 슬롯을 둔다. env/33 가 CODEX_CHAT_AUTH_SLOTS,
      # env/34 이 CODEX_CHAT_AUTH_STORAGE_CLASS.
      - op: test
        path: /spec/template/spec/containers/0/env/33/name
        value: CODEX_CHAT_AUTH_SLOTS
      - op: replace
        path: /spec/template/spec/containers/0/env/33/value
        value: "2"
      - op: test
        path: /spec/template/spec/containers/0/env/34/name
        value: CODEX_CHAT_AUTH_STORAGE_CLASS
      - op: replace
        path: /spec/template/spec/containers/0/env/34/value
        value: ""
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: checkpoint-s3-credentials
              key: secret-key
  # The base's two static NetworkPolicies (deploy/base/network-policy.yaml) are a
  # production boundary and do not fit this SUT: the suites reach the control
  # plane from the host through the NodePort (no traefik here), and shell
  # sessions use in-cluster MinIO for CRIU checkpoints. kind's kindnet does
  # enforce NetworkPolicy, so keeping them would drop the NodePort health check.
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: control-plane-ingress
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: shell-workload-egress
