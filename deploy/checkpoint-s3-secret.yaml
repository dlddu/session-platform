# kind e2e ONLY: the `checkpoint-s3` Secret the control-plane pod reads (its
# secretKeyRefs are required, see k8s/deployment.yaml). Here it points at the
# in-cluster MinIO (deploy/minio.yaml) instead of AWS, so the CRIU round trip
# exercises the real S3 code path without any cloud account.
#
# role-arn is intentionally EMPTY: with no role the store uses the ambient
# credentials directly, which for this SUT are the static keys below (injected
# as AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY by the overlay patch and used as
# MinIO's root user). Production instead sets a real role ARN and assumes it
# over the node instance profile — external-secrets provisions that Secret, and
# this overlay is not used there.
#
# These credentials are throwaway values for a local kind cluster, not secrets.
apiVersion: v1
kind: Secret
metadata:
  name: checkpoint-s3
  labels:
    app: control-plane
type: Opaque
stringData:
  bucket: "session-checkpoints"
  role-arn: ""
  region: "us-east-1"
  prefix: "checkpoints"
  access-key: "e2e-minio-root"
  secret-key: "e2e-minio-password"
