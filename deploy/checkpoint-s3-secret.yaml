# kind e2e ONLY: a placeholder `checkpoint-s3` Secret so the control-plane pod's
# now-required secretKeyRef (k8s/deployment.yaml) resolves and the SUT starts.
# CRIU is off in kind (CRIU_ENABLED=false), so the S3 store is never built and
# these values are inert — they exist only to satisfy the env references.
# Production does NOT use this overlay: it applies the k8s/ base directly and
# external-secrets provisions the real `checkpoint-s3` Secret there.
apiVersion: v1
kind: Secret
metadata:
  name: checkpoint-s3
  labels:
    app: control-plane
type: Opaque
stringData:
  bucket: "kind-e2e-placeholder"
  role-arn: "arn:aws:iam::000000000000:role/kind-e2e-placeholder"
  region: "us-east-1"
  prefix: "checkpoints"
