# kind e2e ONLY: an in-cluster stand-in for the Anthropic provider endpoint.
#
# mock-exception: CLAUDE-PROVIDER — 실 provider(Anthropic API)는 클러스터 안에 실물을 세울 수
# 없다. MinIO 를 EXT 에서 뺀 근거(S3 의 실물 구현이 배포 가능하다)가 여기엔 해당하지 않는다 —
# 구현이 공개돼 있지 않고 모델 가중치가 그 서비스의 본체다. 등재: docs/test/e2e.md
# 「e2e 충실도 허용목록」의 `CLAUDE-PROVIDER`(EXT).
#
# 이것이 무엇을 대신하고 무엇을 대신하지 **않는지**:
#   - 대신하는 것은 **응답을 만드는 주체** 하나뿐이다. 자격 증명 격리(AC-E6)의 왕복은 전부
#     실물이다 — 세션 pod 의 credential-proxy 가 프로덕션 코드 그대로 헤더 허용목록을 적용하고
#     플랫폼 토큰을 주입하며, 여기에 **TLS 를 검증하고** 붙는다(아래 사설 CA). 대역이 bearer 를
#     검사해 틀리면 401 을 내므로 그 주입이 실제로 일어났는지도 대역 쪽에서 확인된다.
#   - 대신하지 **않는** 것: 실 provider 의 스트리밍·오류·토큰 회계 계약. 여기 응답은 결정적
#     상수이고, 실 Claude CLI 의 프롬프트 루프가 이 표면으로 만족되는지는 이 배선이 단언하지
#     않는다(등재 행의 '잔여' 칸에 명시).
#
# test-only 라는 말이 붙는 것은 이 대역 자체다. `deploy/minio.yaml` 이나
# `deploy/plugin-marketplace-git.yaml` 과 달리 프로덕션과 같은 코드 경로가 도는 실물이 아니다.
#
# 왜 HTTPS 인가: 선택이 아니다. credential-proxy 는 upstream 스킴을 https 로 강제한다
# (data-plane/cmd/agent/credential_proxy.go 의 parseCredentialProxyUpstream). 그래서 대역은
# 사설 CA 로 서명한 인증서로 TLS 를 종단하고, 그 CA 를 플랫폼 Secret 의 optional `ca-cert`
# 키로 프록시 컨테이너에만 넘긴다. 프로덕션 base(k8s/)는 그 키가 없어 시스템 풀 그대로다.
#
# 아래 키 자료는 이 레포 전용 일회용이다 — 실 자격 증명이 아니고, 실 호스트를 위한 것도
# 아니며(SAN 은 인클러스터 이름과 loopback 뿐), 외부에서 신뢰되지 않는다.
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-fake-tls
  labels:
    app: anthropic-fake
