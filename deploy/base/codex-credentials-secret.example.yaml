# Example Secret for the codex workload (docs/prd/codex-workload.md). It holds
# one optional key and no provider credential — each codex session signs in to
# ChatGPT itself with a device code on its first prompt (AC-J3).
#
#   k3s-mcp-token  (optional) Bearer token for the homelab K3s MCP. Projected
#                  only into the session pod's loopback `k3s-mcp-proxy` sidecar,
#                  never into the container that runs Codex (AC-J6). Without it
#                  the session runs with neither the K3s MCP tools nor the
#                  marketplace plugin skills (the marketplace clone is minted
#                  through the same K3s MCP).
#
# The control plane names it with CODEX_CREDENTIALS_SECRET (default
# `codex-credentials`), which must differ from every other agent type's Secret
# and ConfigMap name — the keys share names, so sharing an object would hand
# codex another type's token.
#
# EXAMPLE-ONLY, deliberately NOT listed in kustomization.yaml: provision real
# values out-of-band (production: external-secrets in flux-cd-apps).
apiVersion: v1
kind: Secret
metadata:
  name: codex-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  k3s-mcp-token: "REPLACE_ME"
