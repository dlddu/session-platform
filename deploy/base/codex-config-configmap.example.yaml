# Example ConfigMap for the codex workload's non-credential settings
# (docs/prd/codex-workload.md). Every key is optional.
#
#   model                   The model platform-default sessions run, projected
#                           into the Codex container as CODEX_MODEL. Omit it to
#                           let Codex pick its own default for the signed-in plan.
#                           A model chosen on the session itself wins.
#   models                  JSON string array, the UI picker catalog (advisory,
#                           not an allowlist) — projected into the control plane
#                           as CODEX_MODELS, with `model` as CODEX_DEFAULT_MODEL.
#   reasoning-effort        Every session's reasoning effort (minimal, low,
#                           medium, high or xhigh), projected as
#                           CODEX_REASONING_EFFORT; sessions cannot choose one.
#                           Omit it for the model's own default (AC-J1).
#   k3s-mcp-url             K3s MCP endpoint the sidecar forwards to (default
#                           https://homelab-k3s-mcp.llkm.nl/mcp).
#   plugin-marketplace-url  Git remote of the plugin marketplace whose skills
#                           sessions get (default the dlddu plugin-marketplace).
#                           Which plugins is each session's own `plugins` choice.
#   session-db-raw-sql      Debug opt-in for the codex-manager session DB MCP,
#                           projected into the sidecar as SESSION_DB_RAW_SQL.
#                           Omit it and the MCP offers the task ledger alone;
#                           the only accepted value is `debug`, which adds
#                           raw_query/raw_exec (any other value fails the
#                           sidecar's start rather than reading as off).
#   manager-monitor-lane    Opt-in for the codex-manager pod's second execution
#                           context (AC-N11), projected into the workload
#                           container as MANAGER_MONITOR_LANE. `1` runs the
#                           monitor that moves the work beside the parent that
#                           talks to the person — one pod, one slot, one
#                           archive, two conversations; the parent then reads
#                           the work records and the monitor owns writing them.
#                           Omit it or set `0` and a manager runs the single
#                           lane it always did. It is a deployment key rather
#                           than a session choice for the reason
#                           session-db-raw-sql is: it changes what a manager pod
#                           is, and a chat cannot ask for a second lane of
#                           itself. Any other value fails the pod's start
#                           rather than reading as off, so a misspelling cannot
#                           look like a manager that was never paired.
#
# Named by CODEX_CONFIG_CONFIGMAP (default `codex-config`). EXAMPLE-ONLY, not in
# kustomization.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-config
  labels:
    app: control-plane
data:
  model: "gpt-6-sol"
  models: '["gpt-6-sol", "gpt-6-luna"]'
  reasoning-effort: "xhigh"
