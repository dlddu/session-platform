# Example only; do not commit real credentials. This Secret holds the
# claude-code credentials and nothing else; the non-credential keys live in the
# `claude-code-config` ConfigMap (claude-code-config-configmap.example.yaml).
#
#   auth-token    (required for claude-code only when
#                 CLAUDE_CODE_AUTH_MODE=gateway) Projected only into a
#                 credential-proxy. A subscription session never sees it.
#   oauth-token   (required for claude-code only when
#                 CLAUDE_CODE_AUTH_MODE=subscription) The long-lived Claude
#                 subscription token `claude setup-token` prints. Projected
#                 into the claude-code workload container as
#                 CLAUDE_CODE_OAUTH_TOKEN; every subscription session shares
#                 it (AC-E7). Store it without a trailing newline.
#   k3s-mcp-token (optional) The homelab K3s MCP bearer token. Projected only
#                 into the session pod's loopback k3s-mcp-proxy sidecar, which
#                 injects it for the session's K3s MCP calls and uses it to
#                 seed the marketplace plugins the session selected. Without
#                 it a session runs with no K3s MCP tools and no plugins.
#
# Gateway credentials remain sidecar-only (AC-E6).
#
# Provision out-of-band, for example:
#
#   kubectl create secret generic claude-code-credentials \
#     --from-literal=auth-token=REPLACE_ME \
#     --from-literal=oauth-token=REPLACE_ME \
#     --from-literal=k3s-mcp-token=REPLACE_ME
#
# This file is intentionally absent from deploy/base/kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-credentials
  labels:
    app: control-plane
type: Opaque
stringData:
  auth-token: "REPLACE_ME"
  oauth-token: "REPLACE_ME"
  k3s-mcp-token: "REPLACE_ME"
